<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>이메일 찾기 — 온종일 체험단</title>
<link rel="stylesheet" href="../../assets/css/design-system.css">
<style>
.site-header{position:sticky;top:0;z-index:100;background:var(--header-bg);backdrop-filter:saturate(180%) blur(14px);border-bottom:1px solid var(--border);}
.header-inner{display:flex;align-items:center;height:64px;max-width:1240px;margin:0 auto;padding:0 20px;}
.logo{display:flex;align-items:center;gap:10px;}
.logo-mark img{width:38px;height:38px;object-fit:contain;}
.logo-main{font-family:var(--font-serif);font-size:18px;font-weight:700;color:var(--text);}
.auth-page{min-height:calc(100vh - 64px);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;}
.auth-box{background:var(--bg-card);border:1px solid var(--border);border-radius:22px;padding:36px 32px;width:100%;max-width:440px;box-shadow:var(--shadow-lg);}
.auth-title{font-family:var(--font-serif);font-size:24px;font-weight:700;text-align:center;color:var(--text);margin-bottom:6px;}
.auth-sub{font-size:13px;color:var(--text-muted);text-align:center;margin-bottom:26px;line-height:1.6;}
.fg{margin-bottom:14px;}
.fl{font-size:13px;font-weight:600;color:var(--text);display:block;margin-bottom:7px;}
.fi{width:100%;background:var(--bg-card);border:1.5px solid var(--border-2);border-radius:12px;padding:14px 16px;color:var(--text);font-size:15px;outline:none;transition:var(--t);}
.fi:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-tint);}
.sb{width:100%;background:linear-gradient(135deg,#EE3E6D,#F4743B);color:#fff;padding:15px;border-radius:999px;font-size:15px;font-weight:700;margin-top:8px;border:none;cursor:pointer;box-shadow:0 6px 18px rgba(236,58,102,.22);transition:var(--t);}
.sb:hover{transform:translateY(-2px);}
.sb:disabled{opacity:.6;transform:none;}
.msg{display:none;font-size:13px;font-weight:600;padding:12px 14px;border-radius:10px;margin-bottom:12px;line-height:1.5;}
.result{display:none;text-align:center;background:var(--accent-tint);border-radius:14px;padding:22px;margin-bottom:14px;}
.result .em{font-family:var(--font-serif);font-size:22px;font-weight:700;color:var(--accent-text);margin:8px 0;}
.foot{text-align:center;margin-top:18px;font-size:13px;color:var(--text-muted);}
.foot a{color:var(--accent-text);font-weight:700;}
.back-btn{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:700;color:var(--text-muted);background:var(--bg-card);border:1.5px solid var(--border-2);border-radius:999px;padding:8px 16px 8px 12px;margin:16px 0 0 20px;}
.back-btn svg{width:18px;height:18px;}
</style></head>
<body>
<header class="site-header"><div class="header-inner">
  <a href="../../index.html" class="logo"><div class="logo-mark"><img src="../../assets/img/mascot.png" alt="온미"></div><div class="logo-main">온종일 체험단</div></a>
</div></header>
<a href="login.html" class="back-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>로그인으로</a>
<div class="auth-page"><div class="auth-box">
<h1 class="auth-title">이메일 찾기</h1>
<p class="auth-sub">가입 시 등록한 <b>이름과 휴대폰 번호</b>로<br>가입하신 이메일을 찾아드려요.</p>
<div id="msg" class="msg"></div>
<div id="result" class="result"><div style="font-size:13px;color:var(--text-muted);">회원님의 가입 이메일</div><div class="em" id="foundEmail"></div><a href="login.html" class="sb" style="display:block;text-decoration:none;text-align:center;">로그인하러 가기</a></div>
<div id="form">
<div class="fg"><label class="fl">이름</label><input id="fe-name" class="fi" type="text" placeholder="홍길동"></div>
<div class="fg"><label class="fl">휴대폰 번호</label><input id="fe-phone" class="fi" type="tel" placeholder="010-1234-5678" inputmode="numeric"></div>
<button class="sb" id="fe-btn" onclick="doFind()">이메일 찾기</button>
</div>
<div class="foot">비밀번호를 잊으셨나요? <a href="find-password.html">비밀번호 찾기</a></div>
</div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../assets/js/auth.js"></script>
<script>function msg(t){var m=document.getElementById('msg');m.style.display='block';m.textContent=t;m.style.background='rgba(236,58,102,.1)';m.style.color='#d61f56';}
async function doFind(){
  var name=document.getElementById('fe-name').value.trim();
  var phone=document.getElementById('fe-phone').value.trim();
  if(!name||phone.replace(/[^0-9]/g,'').length<10){return msg('이름과 휴대폰 번호를 정확히 입력해주세요.');}
  var b=document.getElementById('fe-btn');b.disabled=true;b.textContent='찾는 중...';
  try{
    var r=await OnAuth.findEmail(name,phone);
    if(r.error){msg('조회 중 오류가 발생했어요.');b.disabled=false;b.textContent='이메일 찾기';return;}
    if(!r.data){msg('일치하는 회원 정보가 없어요. 입력을 확인해주세요.');b.disabled=false;b.textContent='이메일 찾기';return;}
    document.getElementById('form').style.display='none';
    document.getElementById('foundEmail').textContent=r.data;
    document.getElementById('result').style.display='block';
  }catch(e){msg('오류가 발생했어요.');b.disabled=false;b.textContent='이메일 찾기';}
}</script>
</body></html>
