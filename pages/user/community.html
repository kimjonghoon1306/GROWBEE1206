<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>커뮤니티 — 온종일 체험단</title>
<link rel="stylesheet" href="../../assets/css/design-system.css"><link rel="stylesheet" href="../../assets/css/brutal.css"><link rel="stylesheet" href="../../assets/css/platform.css">
<style>.cm-wrap{max-width:1040px;margin:auto;padding:110px 20px 70px}.cm-head{display:flex;justify-content:space-between;gap:16px;align-items:end;margin-bottom:22px}.cm-head h1{font-size:34px;margin:0}.cm-head p{color:var(--text-muted);margin:6px 0 0}.cm-btn{border:0;border-radius:99px;background:var(--brand-gradient);color:#fff;padding:11px 17px;font-weight:800;cursor:pointer}.cm-tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:18px}.cm-tabs button{border:1px solid var(--border);border-radius:99px;padding:8px 13px;background:var(--bg-card);color:var(--text-muted);cursor:pointer}.cm-tabs button.on{background:var(--brand-gradient);color:#fff;border-color:transparent}.cm-list{display:grid;gap:10px}.cm-post{padding:18px;border:1px solid var(--border);border-radius:15px;background:var(--bg-card)}.cm-post small{color:var(--brand-primary);font-weight:800}.cm-post h2{font-size:17px;margin:7px 0}.cm-post p{font-size:13px;color:var(--text-muted);line-height:1.65;white-space:pre-wrap}.cm-meta{font-size:11px;color:var(--text-muted);margin-top:10px}.cm-modal{display:none;position:fixed;inset:0;z-index:10000;background:#0009;align-items:center;justify-content:center;padding:18px}.cm-modal.show{display:flex}.cm-card{width:min(520px,100%);background:var(--bg-card);border-radius:17px;padding:22px}.cm-card input,.cm-card select,.cm-card textarea{width:100%;box-sizing:border-box;margin:6px 0;border:1px solid var(--border);border-radius:10px;background:var(--bg-card2);color:var(--text);padding:11px}.cm-card textarea{min-height:160px}</style></head><body>
<header class="site-header"><div class="header-inner"><a href="../../index.html" class="logo"><img src="../../assets/img/mascot.png" alt="온미" style="width:34px"><b>온종일 체험단</b></a><nav class="nav-links"><a href="campaigns.html" class="nav-link">체험단</a><a href="community.html" class="nav-link active">커뮤니티</a><a href="mypage.html" class="nav-link">마이페이지</a></nav></div></header>
<main class="cm-wrap"><div class="cm-head"><div><h1>리뷰어 커뮤니티</h1><p>체험 노하우와 촬영·콘텐츠 팁을 안전하게 나눠보세요.</p></div><button class="cm-btn" id="cmWrite">글쓰기</button></div><div class="cm-tabs" id="cmTabs"></div><div class="cm-list" id="cmList">불러오는 중…</div></main>
<div class="cm-modal" id="cmModal"><div class="cm-card"><h2>커뮤니티 글쓰기</h2><select id="cmCategory"><option>노하우</option><option>촬영팁</option><option>지역질문</option><option>캠페인후기</option></select><input id="cmTitle" maxlength="120" placeholder="제목"><textarea id="cmBody" maxlength="5000" placeholder="개인정보와 업체 비방 표현은 제외하고 작성해 주세요."></textarea><div id="cmMsg" style="color:#d61f56;font-size:12px;min-height:20px;"></div><div style="display:flex;gap:8px;"><button class="cm-btn" id="cmCancel" style="background:var(--bg-card2);color:var(--text);">취소</button><button class="cm-btn" id="cmSubmit">등록하기</button></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../../assets/js/auth.js?v=20260816a"></script><script>
(function(){var cats=['전체','노하우','촬영팁','지역질문','캠페인후기'],cur='전체';function esc(x){return String(x||'').replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}var tabs=document.getElementById('cmTabs');tabs.innerHTML=cats.map(function(c){return '<button data-c="'+c+'">'+c+'</button>';}).join('');async function load(){tabs.querySelectorAll('button').forEach(function(b){b.classList.toggle('on',b.dataset.c===cur);});var rows=await OnAuth.listCommunityPosts(cur==='전체'?null:cur),el=document.getElementById('cmList');el.innerHTML=rows.length?rows.map(function(p){return '<article class="cm-post" data-id="'+p.id+'"><small>'+esc(p.category)+'</small><h2>'+esc(p.title)+'</h2><p>'+esc(p.body)+'</p><div class="cm-meta">'+esc(p.author)+' · '+new Date(p.created_at).toLocaleDateString('ko-KR')+' · 댓글 '+(p.comment_count||0)+' <button data-comment="'+p.id+'">댓글쓰기</button> <button data-report="'+p.id+'">신고</button></div></article>';}).join(''):'<div class="cm-post">첫 번째 노하우를 공유해 보세요.</div>';el.querySelectorAll('[data-comment]').forEach(function(b){b.onclick=async function(){if(!await OnAuth.getUser()){location.href='login.html?next=community.html';return;}var t=prompt('댓글을 입력하세요.');if(!t)return;var r=await OnAuth.createCommunityComment(this.dataset.comment,t);if(r&&r.ok)load();else alert((r&&r.msg)||'댓글 등록 실패');};});el.querySelectorAll('[data-report]').forEach(function(b){b.onclick=async function(){if(!await OnAuth.getUser()){location.href='login.html?next=community.html';return;}var t=prompt('신고 사유를 입력하세요.');if(!t)return;var r=await OnAuth.reportCommunity(this.dataset.report,null,t);alert(r&&r.ok?'신고가 접수됐습니다.':((r&&r.msg)||'신고 실패'));};});}tabs.onclick=function(e){if(e.target.dataset.c){cur=e.target.dataset.c;load();}};var modal=document.getElementById('cmModal');document.getElementById('cmWrite').onclick=async function(){if(!await OnAuth.getUser()){location.href='login.html?next=community.html';return;}modal.classList.add('show');};document.getElementById('cmCancel').onclick=function(){modal.classList.remove('show');};document.getElementById('cmSubmit').onclick=async function(){var r=await OnAuth.createCommunityPost(document.getElementById('cmCategory').value,document.getElementById('cmTitle').value.trim(),document.getElementById('cmBody').value.trim());if(!r||!r.ok){document.getElementById('cmMsg').textContent=(r&&r.msg)||'등록 실패';return;}modal.classList.remove('show');document.getElementById('cmTitle').value='';document.getElementById('cmBody').value='';load();};load();})();
</script><script src="../../assets/js/platform.js" defer></script><script src="../../assets/js/navigation.js?v=20260816b" defer></script>
</body></html>
