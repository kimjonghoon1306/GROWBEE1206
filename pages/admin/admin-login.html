<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>관리자 로그인 — 온종일 체험단</title>
<link rel="stylesheet" href="../../assets/css/design-system.css">
<style>
body{ --bg:#1B1E27;--bg-card:#2A2F3E;--border:rgba(255,255,255,.12);--text:#F4F5F8;--text-muted:#AEB4C2; background:var(--bg); color:var(--text); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; transition:background .25s,color .25s; }
body.light{ --bg:#FBF8F2;--bg-card:#FFFFFF;--border:rgba(0,0,0,.1);--text:#2A241F;--text-muted:#877E72; }
body.light .fi{ background:#F5F1E8; }
.thbtn{ position:fixed; top:18px; right:18px; width:42px;height:42px;border-radius:999px;background:var(--bg-card);border:1.5px solid var(--border);color:var(--text);display:flex;align-items:center;justify-content:center;cursor:pointer; }
.thbtn svg{ width:20px;height:20px; }
.box{ background:var(--bg-card); border:1px solid var(--border); border-radius:22px; padding:40px 34px; width:100%; max-width:400px; box-shadow:0 20px 60px rgba(0,0,0,.4); }
.logo{ width:56px;height:56px;border-radius:16px;background:linear-gradient(135deg,#EE3E6D,#F4743B);display:flex;align-items:center;justify-content:center;margin:0 auto 16px; }
.logo img{ width:40px;height:40px;object-fit:contain; }
.t{ font-family:var(--font-serif);font-size:22px;font-weight:700;text-align:center;margin-bottom:4px; }
.s{ font-size:13px;color:var(--text-muted);text-align:center;margin-bottom:26px; }
.fl{ font-size:12px;font-weight:600;color:var(--text-muted);display:block;margin-bottom:6px; }
.fi{ width:100%;background:#1B1E27;border:1.5px solid var(--border);border-radius:12px;padding:14px 15px;color:var(--text);font-size:15px;outline:none;margin-bottom:14px; }
.fi:focus{ border-color:#EE3E6D; }
.sb{ width:100%;background:linear-gradient(135deg,#EE3E6D,#F4743B);color:#fff;padding:15px;border-radius:12px;font-size:15px;font-weight:700;border:none;cursor:pointer; }
.sb:disabled{ opacity:.6; }
.msg{ display:none;font-size:13px;font-weight:600;padding:11px 14px;border-radius:10px;margin-bottom:12px; }
.foot{ text-align:center;margin-top:18px;font-size:12px;color:var(--text-muted); }
.foot a{ color:#FF8FA8; }
</style>
<link rel="stylesheet" href="../../assets/css/platform.css">
</head>
<body>
<button class="thbtn" id="thBtn" onclick="thToggle()" title="낮/밤" aria-label="낮/밤"><svg id="thIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
<div class="box">
  <div class="logo"><img src="../../assets/img/mascot.png" alt="온미"></div>
  <div class="t">관리자 로그인</div>
  <div class="s">온종일 체험단 운영 관리자 전용</div>
  <div id="msg" class="msg"></div>
  <label class="fl">이메일</label>
  <input id="ad-email" class="fi" type="email" placeholder="관리자 이메일" value="s9653@naver.com">
  <label class="fl">비밀번호</label>
  <input id="ad-pw" class="fi" type="password" placeholder="비밀번호" onkeydown="if(event.key==='Enter')doLogin()">
  <button class="sb" id="ad-btn" onclick="doLogin()">로그인</button>
  <div class="foot"><a href="../../index.html">← 사이트로 돌아가기</a></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../assets/js/auth.js"></script>
<script>
var _sun='<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>';
var _moon='<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>';
function thToggle(){var l=document.body.classList.toggle('light');document.getElementById('thIcon').innerHTML=l?_moon:_sun;localStorage.setItem('onjongil-admin-theme',l?'light':'dark');}
(function(){if(localStorage.getItem('onjongil-admin-theme')==='light'){document.body.classList.add('light');document.getElementById('thIcon').innerHTML=_moon;}else{document.getElementById('thIcon').innerHTML=_sun;}})();
function msg(t){var m=document.getElementById('msg');m.style.display='block';m.textContent=t;m.style.background='rgba(236,58,102,.12)';m.style.color='#FF8FA8';}
async function doLogin(){
  var email=document.getElementById('ad-email').value.trim();
  var pw=document.getElementById('ad-pw').value;
  if(!email||!pw){return msg('이메일과 비밀번호를 입력해주세요.');}
  var b=document.getElementById('ad-btn');b.disabled=true;b.textContent='로그인 중...';
  try{
    var r=await OnAuth.signIn(email,pw);
    if(r.error){msg('로그인 실패: 이메일 또는 비밀번호를 확인해주세요.');b.disabled=false;b.textContent='로그인';return;}
    var prof=await OnAuth.getProfile();
    if(!prof || prof.role!=='admin'){ await OnAuth.client.auth.signOut(); msg('관리자 권한이 없는 계정입니다.'); b.disabled=false;b.textContent='로그인'; return; }
    location.href='admin-dashboard.html';
  }catch(e){msg('오류가 발생했어요.');b.disabled=false;b.textContent='로그인';}
}
(async function(){ var p=await OnAuth.getProfile(); if(p&&p.role==='admin'){ location.href='admin-dashboard.html'; } })();
</script>
<script src="../../assets/js/pwa.js" defer></script>
<script src="../../assets/js/platform.js" defer></script>
</body>
</html>
