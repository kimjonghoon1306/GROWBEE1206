<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>콘텐츠 CMS — 온종일 체험단 Admin</title><link rel="stylesheet" href="../../assets/css/design-system.css"><link rel="stylesheet" href="../../assets/css/platform.css"><style>body{background:#0f0d12;color:var(--text)}.ac{max-width:1100px;margin:auto;padding:38px 20px}.ac-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.ac-head a{color:var(--text-muted);text-decoration:none}.ac-grid{display:grid;grid-template-columns:380px 1fr;gap:16px}.ac-card{background:var(--bg-card);border:1px solid var(--border);border-radius:15px;padding:18px}.ac-card input,.ac-card select,.ac-card textarea{width:100%;box-sizing:border-box;margin:5px 0 10px;padding:10px;border:1px solid var(--border);border-radius:9px;background:var(--bg-card2);color:var(--text)}.ac-card textarea{min-height:190px}.ac-btn{border:0;border-radius:99px;padding:10px 14px;background:var(--brand-gradient);color:#fff;font-weight:800;cursor:pointer}.ac-item{padding:12px;border-bottom:1px solid var(--border);cursor:pointer}.ac-item small{display:block;color:var(--text-muted);margin-top:4px}.ac-risk{color:#ff708f;font-weight:800}@media(max-width:760px){.ac-grid{grid-template-columns:1fr}}</style></head><body><main class="ac"><div class="ac-head"><div><h1>콘텐츠 CMS</h1><p>공지·가이드·이벤트와 커뮤니티 신고를 관리합니다.</p></div><a href="admin-dashboard.html">← 관리자 홈</a></div><div class="ac-grid"><section class="ac-card"><h2>콘텐츠 작성</h2><input id="acId" type="hidden"><select id="acType"><option value="notice">공지</option><option value="guide">이용가이드</option><option value="event">이벤트</option></select><input id="acSlug" placeholder="고유 주소(신규만)"><input id="acTitle" placeholder="제목"><textarea id="acBody" placeholder="내용"></textarea><select id="acAudience"><option value="all">전체</option><option value="reviewer">리뷰어</option><option value="advertiser">광고주</option></select><select id="acStatus"><option value="draft">임시저장</option><option value="published">게시</option></select><button class="ac-btn" id="acSave">저장</button><div id="acMsg"></div></section><section><div class="ac-card"><h2>등록 콘텐츠</h2><div id="acList">불러오는 중…</div></div><div class="ac-card" style="margin-top:16px;"><h2>커뮤니티 신고 <span class="ac-risk" id="acRisk"></span></h2><div id="acReports">불러오는 중…</div></div></section></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../../assets/js/auth.js"></script><script>
(async function(){if(!await OnAuth.requireAdmin())return;var rows=[];function esc(x){return String(x||'').replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}async function load(){rows=await OnAuth.adminListCms();document.getElementById('acList').innerHTML=rows.length?rows.map(function(x){return '<div class="ac-item" data-id="'+x.id+'"><b>'+esc(x.title)+'</b><small>'+esc(x.content_type)+' · '+esc(x.audience)+' · '+esc(x.status)+'</small></div>';}).join(''):'등록 콘텐츠가 없습니다.';document.querySelectorAll('.ac-item').forEach(function(el){el.onclick=function(){var x=rows.find(function(r){return r.id===el.dataset.id;});if(!x)return;acId.value=x.id;acType.value=x.content_type;acSlug.value=x.slug;acSlug.disabled=true;acTitle.value=x.title;acBody.value=x.body;acAudience.value=x.audience;acStatus.value=x.status;};});}var reps=await OnAuth.adminModerationQueue();acRisk.textContent=reps.length?reps.length+'건':'';acReports.innerHTML=reps.length?reps.map(function(r){return '<div class="ac-item"><b>'+esc(r.reason)+'</b><small>'+new Date(r.created_at).toLocaleString('ko-KR')+' · '+(r.post_id?'게시글':'댓글')+'</small></div>';}).join(''):'처리할 신고가 없습니다.';acSave.onclick=async function(){var r=await OnAuth.adminSaveCms(acId.value||null,{content_type:acType.value,slug:acSlug.value.trim(),title:acTitle.value.trim(),body:acBody.value,audience:acAudience.value,status:acStatus.value});acMsg.textContent=r&&r.ok?'저장했습니다.':((r&&r.msg)||'저장 실패');if(r&&r.ok){acId.value='';acSlug.disabled=false;load();}};load();})();
</script><script src="../../assets/js/platform.js" defer></script></body></html>
