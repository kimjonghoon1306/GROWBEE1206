<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>광고주 관리 — 온종일 체험단 Admin</title>
<link rel="stylesheet" href="../../assets/css/design-system.css">
<style>
body{--bg:#1B1E27;--bg-surface:#222633;--bg-card:#2A2F3E;--bg-card2:#323848;--border:rgba(255,255,255,0.12);--text:#F4F5F8;--text-muted:#AEB4C2;--shadow:0 4px 24px rgba(0,0,0,.35);--shadow-card:0 8px 32px rgba(0,0,0,.4);--header-bg:rgba(27,30,39,0.95);--nav-active-bg:rgba(255,255,255,0.08);}body.light{--bg:#FBF8F2;--bg-surface:#FFFFFF;--bg-card:#FFFFFF;--bg-card2:#F5F1E8;--border:rgba(0,0,0,.09);--text:#2A241F;--text-muted:#877E72;--shadow:0 6px 22px rgba(60,42,20,.07);--shadow-card:0 16px 44px rgba(60,42,20,.11);--header-bg:rgba(251,248,242,.95);--nav-active-bg:rgba(236,58,102,.08);}
.admin-wrap{display:grid;grid-template-columns:220px 1fr;min-height:100vh;}
.admin-sidebar{background:var(--bg-surface);border-right:1px solid var(--border);padding:0;position:sticky;top:0;height:100vh;overflow-y:auto;}
.sidebar-logo{padding:18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;}
.sidebar-logo-mark{width:30px;height:30px;border-radius:9px;background:var(--brand-gradient);display:flex;align-items:center;justify-content:center;}
.sidebar-logo-mark svg{width:16px;height:16px;}
.sidebar-logo-text{font-family:var(--font-display);font-size:14px;font-weight:800;color:var(--text);}
.sidebar-logo-sub{font-size:10px;color:var(--text-muted);font-weight:600;}
.sidebar-section{padding:14px 10px 6px;}
.sidebar-section-label{font-size:10px;font-weight:700;color:var(--text-muted);letter-spacing:1px;text-transform:uppercase;padding:0 8px;margin-bottom:5px;}
.sidebar-link{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;font-size:13px;font-weight:500;color:var(--text-muted);transition:var(--transition);cursor:pointer;text-decoration:none;margin-bottom:2px;}
.sidebar-link:hover{background:rgba(255,255,255,.05);color:var(--text);}
.sidebar-link.active{background:rgba(255,71,87,.12);color:var(--brand-primary);font-weight:700;}
.sidebar-link span.ico{font-size:15px;flex-shrink:0;}
.sidebar-badge{margin-left:auto;background:var(--brand-primary);color:#fff;font-size:10px;font-weight:700;padding:2px 7px;border-radius:50px;}
.admin-main{background:var(--bg);overflow-y:auto;}
.admin-topbar{position:sticky;top:0;z-index:10;background:var(--header-bg);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);padding:0 28px;height:60px;display:flex;align-items:center;justify-content:space-between;}
.admin-page-title{font-family:var(--font-display);font-size:18px;font-weight:800;color:var(--text);}
.topbar-btn{padding:8px 16px;border-radius:50px;font-size:12px;font-weight:600;background:rgba(255,255,255,.06);border:1px solid var(--border);color:var(--text-muted);cursor:pointer;transition:var(--transition);text-decoration:none;}
.topbar-btn:hover{color:var(--text);background:rgba(255,255,255,.1);}
.topbar-exit{color:var(--brand-primary);border-color:rgba(255,71,87,.3);background:rgba(255,71,87,.08);}
.admin-content{padding:28px;}
.admin-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:22px;margin-bottom:20px;}
.admin-card-title{font-size:15px;font-weight:700;color:var(--text);margin-bottom:18px;}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px;}
.kpi{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-md);padding:16px 18px;}
.kpi b{display:block;font-size:24px;font-weight:800;color:var(--text);} .kpi span{font-size:12px;color:var(--text-muted);}
.kpi.warn b{color:#FFA502;}
.admin-table{width:100%;border-collapse:collapse;font-size:13px;}
.admin-table th{font-size:11px;font-weight:700;color:var(--text-muted);text-align:left;padding:0 0 12px;border-bottom:1px solid var(--border);white-space:nowrap;}
.admin-table td{padding:12px 0;border-bottom:1px solid rgba(255,255,255,.04);color:var(--text-muted);vertical-align:middle;}
.admin-table tr:last-child td{border:none;}
.admin-table td:first-child{color:var(--text);font-weight:600;}
.s-badge{display:inline-block;font-size:10px;font-weight:700;padding:3px 9px;border-radius:50px;white-space:nowrap;}
.s-active{background:rgba(46,213,115,.15);color:#2ED573;}
.s-pending{background:rgba(84,160,255,.15);color:#54A0FF;}
.s-susp{background:rgba(255,71,87,.15);color:var(--brand-primary);}
.abtn{border:none;border-radius:50px;padding:7px 14px;font-size:12px;font-weight:700;cursor:pointer;}
.abtn.ok{background:var(--brand-gradient);color:#fff;} .abtn.ghost{background:transparent;border:1.5px solid var(--border);color:var(--text-muted);}
.search-bar{display:flex;gap:10px;margin-bottom:20px;}
.search-input{flex:1;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-md);padding:11px 16px;color:var(--text);font-size:13px;font-family:var(--font-display);outline:none;}
.search-input:focus{border-color:rgba(255,71,87,.4);}
.search-input::placeholder{color:var(--text-muted);}
.adm-pager{display:flex;gap:6px;flex-wrap:wrap;margin-top:16px;}
.adm-pager button{background:var(--bg-card2);border:1px solid var(--border);color:var(--text-muted);border-radius:8px;padding:7px 12px;font-size:12px;font-weight:700;cursor:pointer;}
.adm-pager button.active{background:var(--brand-primary);color:#fff;border-color:var(--brand-primary);}
@media(max-width:768px){.admin-wrap{grid-template-columns:1fr;}.admin-content{padding:16px;}.kpis{grid-template-columns:1fr 1fr;}.admin-topbar{padding:10px 14px !important;}.adm-ham{display:inline-flex !important;}.admin-sidebar{display:block !important;position:fixed;top:0;left:0;bottom:0;width:240px;z-index:200;transform:translateX(-100%);transition:transform .28s ease;box-shadow:0 0 40px rgba(0,0,0,.5);}.admin-sidebar.open{transform:translateX(0);}.adm-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:150;}.adm-backdrop.open{display:block;}
  .admin-card{padding:14px;}.admin-table thead{display:none;}.admin-table,.admin-table tbody,.admin-table tr,.admin-table td{display:block;width:100%;}
  .admin-table tr{border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:12px;background:var(--bg-card2);}
  .admin-table td{border:none;padding:7px 0;display:flex;justify-content:space-between;align-items:baseline;gap:14px;text-align:right;flex-wrap:wrap;word-break:keep-all;}
  .admin-table td::before{content:attr(data-label);font-size:11px;font-weight:700;color:var(--text-muted);flex-shrink:0;text-align:left;}
  .admin-table td:not([data-label]):not(:first-child)::before{content:none;}
  .admin-table td:first-child{flex-direction:column;align-items:flex-start;text-align:left;font-size:15px;padding:2px 0 10px;border-bottom:1px solid var(--border);margin-bottom:4px;}
  .admin-table td:first-child::before{content:none;}}
/* modal */
.mv-overlay{display:none;position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.55);align-items:center;justify-content:center;padding:20px;}
.mv-card{background:var(--bg-card);border:1px solid var(--border);border-radius:16px;width:100%;max-width:560px;max-height:88vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.4);}
.mv-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:22px 22px 14px;border-bottom:1px solid var(--border);}
.mv-h-name{font-size:18px;font-weight:800;color:var(--text);}
.mv-h-sub{font-size:13px;color:var(--text-muted);margin-top:3px;}
.mv-x{background:none;border:none;color:var(--text-muted);font-size:22px;line-height:1;cursor:pointer;padding:2px 6px;}
.mv-body{padding:18px 22px 24px;}
.mv-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;margin-bottom:18px;}
.mv-f{font-size:11px;color:var(--text-muted);font-weight:700;letter-spacing:.3px;text-transform:uppercase;}
.mv-v{font-size:14px;color:var(--text);margin-top:2px;font-weight:600;}
.mv-sec-t{font-size:13px;font-weight:700;color:var(--text);margin:14px 0 8px;}
.mv-list{border:1px solid var(--border);border-radius:10px;overflow:hidden;}
.mv-li{display:flex;justify-content:space-between;gap:10px;padding:10px 12px;font-size:13px;border-top:1px solid var(--border);color:var(--text);}
.mv-li:first-child{border-top:none;}
.mv-empty{padding:16px 12px;color:var(--text-muted);font-size:13px;text-align:center;}
.mv-actions{display:flex;justify-content:space-between;gap:10px;margin-top:22px;padding-top:16px;border-top:1px solid var(--border);flex-wrap:wrap;}
.mv-btn{border:none;border-radius:50px;padding:11px 18px;font-size:13px;font-weight:700;cursor:pointer;}
.mv-btn.pri{background:var(--brand-gradient);color:#fff;} .mv-btn.warn{background:transparent;border:1.5px solid var(--border);color:var(--text);} .mv-btn.ghost{background:transparent;border:1.5px solid var(--border);color:var(--text-muted);}
@media(max-width:520px){.mv-grid{grid-template-columns:1fr;}}
</style>

<script>
var _sun='<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>';
var _moon='<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>';
function admToggle(){var lt=document.body.classList.toggle("light");document.getElementById("admThemeIcon").innerHTML=lt?_sun:_moon;localStorage.setItem("onjongil-admin-theme",lt?"light":"dark");}
(function(){if(localStorage.getItem("onjongil-admin-theme")==="light"){document.body.classList.add("light");var i=document.getElementById("admThemeIcon");if(i)i.innerHTML=_sun;}})();
function admSide(){var s=document.querySelector('.admin-sidebar');var b=document.querySelector('.adm-backdrop');s.classList.toggle('open');if(b)b.classList.toggle('open');}
(function(){if(!document.querySelector('.adm-backdrop')){var d=document.createElement('div');d.className='adm-backdrop';d.onclick=admSide;document.body.appendChild(d);}})();
</script>

<script src="../../assets/js/auth.js"></script>
<script>
function esc(s){return (s==null?'':String(s)).replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});}
function fmtDate(iso){ if(!iso) return '-'; var d=new Date(iso); return (''+d.getFullYear()).slice(2)+'.'+('0'+(d.getMonth()+1)).slice(-2)+'.'+('0'+d.getDate()).slice(-2); }
function fmtPhone(p){ if(!p) return '-'; p=(''+p).replace(/[^0-9]/g,''); if(p.length===11) return p.slice(0,3)+'-'+p.slice(3,7)+'-'+p.slice(7); return p||'-'; }
var ADV=[], PAGE=1, PER=20, MAP={};
(async function(){
  var admin=await OnAuth.requireAdmin(); if(!admin) return;
  await load();
  document.getElementById('advSearch').oninput=function(){ PAGE=1; render(); };
  document.getElementById('advFilter').onchange=function(){ PAGE=1; render(); };
})();
async function load(){
  ADV=await OnAuth.adminListAdvertisers(); MAP={}; ADV.forEach(function(a){MAP[a.id]=a;});
  var pending=ADV.filter(function(a){return !a.approved;}).length;
  var camps=ADV.reduce(function(s,a){return s+(parseInt(a.campaign_count,10)||0);},0);
  document.getElementById('kTotal').textContent=ADV.length;
  document.getElementById('kPending').textContent=pending;
  document.getElementById('kCamps').textContent=camps;
  var sb=document.getElementById('sbPending'); if(pending>0){ sb.textContent=pending; sb.style.display=''; } else sb.style.display='none';
  render();
}
function filtered(){
  var q=(document.getElementById('advSearch').value||'').toLowerCase().trim();
  var f=document.getElementById('advFilter').value;
  return ADV.filter(function(a){
    if(f==='pending'&&a.approved) return false;
    if(f==='approved'&&!a.approved) return false;
    if(!q) return true;
    return ((a.biz_name||'')+(a.name||'')+(a.email||'')+(a.phone||'')).toLowerCase().indexOf(q)>=0;
  });
}
function statusBadge(a){
  if(a.suspended) return '<span class="s-badge s-susp">정지</span>';
  return a.approved?'<span class="s-badge s-active">승인</span>':'<span class="s-badge s-pending">대기</span>';
}
function render(){
  var body=document.getElementById('advBody'), pager=document.getElementById('advPager');
  var rows=filtered();
  document.getElementById('advCount').textContent='('+rows.length+'개'+(rows.length!==ADV.length?(' / 전체 '+ADV.length):'')+')';
  var pages=Math.max(1,Math.ceil(rows.length/PER)); if(PAGE>pages)PAGE=pages;
  if(!rows.length){ body.innerHTML='<tr><td colspan="8" style="text-align:center;padding:30px 0;color:var(--text-muted);">해당하는 광고주가 없어요.</td></tr>'; pager.innerHTML=''; return; }
  var slice=rows.slice((PAGE-1)*PER, PAGE*PER);
  body.innerHTML=slice.map(function(a){
    var biz=esc(a.biz_name||'(업체명 미입력)');
    var act=a.approved
      ? '<button class="abtn ghost" onclick="toggleApprove(\''+a.id+'\',false)">승인취소</button>'
      : '<button class="abtn ok" onclick="toggleApprove(\''+a.id+'\',true)">승인</button>';
    return '<tr data-uid="'+a.id+'">'
      +'<td><a href="#" onclick="openAdv(\''+a.id+'\');return false;" style="color:var(--text);text-decoration:none;"><b>'+biz+'</b></a><div style="color:var(--text-muted);font-size:11px;font-weight:400;margin-top:2px;">'+esc(a.name||'')+'</div></td>'
      +'<td data-label="연락처" style="color:var(--text-muted);"><div>'+esc(a.email||'-')+'</div><div style="font-size:11px;">'+fmtPhone(a.phone)+'</div></td>'
      +'<td data-label="업종·지역" style="color:var(--text-muted);">'+esc(a.biz_category||'-')+(a.biz_region?(' · '+esc(a.biz_region)):'')+'</td>'
      +'<td data-label="캠페인" style="color:var(--text-muted);">'+(a.campaign_count||0)+'개</td>'
      +'<td data-label="신청" style="color:var(--text-muted);">'+(a.applicant_count||0)+'건</td>'
      +'<td data-label="상태">'+statusBadge(a)+'</td>'
      +'<td data-label="가입일" style="color:var(--text-muted);">'+fmtDate(a.created_at)+'</td>'
      +'<td data-label="관리"><a href="#" onclick="openAdv(\''+a.id+'\');return false;" style="color:var(--brand-primary);font-size:12px;font-weight:600;margin-right:8px;">상세</a>'+act+'</td>'
      +'</tr>';
  }).join('');
  if(pages<=1) pager.innerHTML='';
  else { var h=''; for(var i=1;i<=pages;i++){h+='<button class="'+(i===PAGE?'active':'')+'" onclick="PAGE='+i+';render();">'+i+'</button>';} pager.innerHTML=h; }
}
async function toggleApprove(id, ok){
  var a=MAP[id]; if(!a) return;
  if(!confirm((ok?'이 광고주를 승인할까요?':'승인을 취소할까요?')+'\n업체: '+(a.biz_name||a.name||''))) return;
  var r=await OnAuth.setAdvertiserApproved(id, ok);
  if(!r||!r.ok){ alert('처리 실패: '+((r&&r.msg)||'다시 시도')); return; }
  a.approved=ok; await load();
}
// 상세
async function openAdv(id){
  var a=MAP[id]; if(!a) return;
  document.getElementById('mvName').textContent=a.biz_name||'(업체명 미입력)';
  document.getElementById('mvSub').textContent=a.email||'';
  document.getElementById('mvRep').textContent=a.name||'-';
  document.getElementById('mvPhone').textContent=fmtPhone(a.phone);
  document.getElementById('mvCat').textContent=a.biz_category||'-';
  document.getElementById('mvRegion').textContent=a.biz_region||'-';
  document.getElementById('mvJoined').textContent=fmtDate(a.created_at);
  document.getElementById('mvApproved').innerHTML=statusBadge(a);
  var btn=document.getElementById('mvApproveBtn');
  btn.textContent=a.approved?'승인 취소':'승인하기'; btn.dataset.uid=id; btn.dataset.ok=a.approved?'0':'1';
  document.getElementById('mvOverlay').style.display='flex';
  var el=document.getElementById('mvCamps'); el.innerHTML='<div class="mv-empty">불러오는 중…</div>';
  var camps=await OnAuth.adminAdvertiserCampaigns(id);
  document.getElementById('mvCampCnt').textContent=camps.length?('('+camps.length+'개)'):'';
  el.innerHTML=camps.length? camps.map(function(c){
    var st=c.status==='active'?'모집중':(c.status==='draft'?'임시':'마감');
    return '<div class="mv-li"><div><div>'+esc(c.title)+'</div><div style="color:var(--text-muted);font-size:11px;margin-top:2px;">'+esc(c.reward_text||'')+'</div></div><div style="color:var(--text-muted);white-space:nowrap;">'+(c.applied_count||0)+'/'+(c.capacity||0)+' · '+st+'</div></div>';
  }).join('') : '<div class="mv-empty">등록한 캠페인이 없습니다.</div>';
}
function closeAdv(){ document.getElementById('mvOverlay').style.display='none'; }
async function doApprove(btn){
  var id=btn.dataset.uid, ok=btn.dataset.ok==='1';
  await toggleApprove(id, ok);
  if(MAP[id]) openAdv(id);
}
document.addEventListener('click',function(e){ if(e.target&&e.target.id==='mvOverlay') closeAdv(); });
document.addEventListener('click',function(e){
  var a=e.target.closest?e.target.closest('a.sidebar-link'):null;
  if(a && a.getAttribute('href')==='#'){ e.preventDefault(); alert('준비 중인 기능이에요. 곧 추가됩니다!'); }
});
</script>
<script src="../../assets/js/pwa.js" defer></script>
</body></html>
