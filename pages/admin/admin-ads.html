<head>

<style>
body{--bg:#1B1E27;--bg-surface:#222633;--bg-card:#2A2F3E;--bg-card2:#323848;--border:rgba(255,255,255,0.12);--text:#F4F5F8;--text-muted:#AEB4C2;--shadow:0 4px 24px rgba(0,0,0,.35);--shadow-card:0 8px 32px rgba(0,0,0,.4);--header-bg:rgba(27,30,39,0.95);--nav-active-bg:rgba(255,255,255,0.08);}body.light{--bg:#FBF8F2;--bg-surface:#FFFFFF;--bg-card:#FFFFFF;--bg-card2:#F5F1E8;--border:rgba(0,0,0,.09);--text:#2A241F;--text-muted:#877E72;--shadow:0 6px 22px rgba(60,42,20,.07);--shadow-card:0 16px 44px rgba(60,42,20,.11);--header-bg:rgba(251,248,242,.95);--nav-active-bg:rgba(236,58,102,.08);}
.admin-wrap{display:grid;grid-template-columns:220px 1fr;min-height:100vh;}
.admin-sidebar{background:var(--bg-surface);border-right:1px solid var(--border);padding:0;position:sticky;top:0;height:100vh;overflow-y:auto;}
.sidebar-logo{padding:18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;}
.sidebar-logo-mark{width:30px;height:30px;border-radius:9px;background:var(--brand-gradient);display:flex;align-items:center;justify-content:center;}
.sidebar-logo-mark svg{width:16px;height:16px;}
.sidebar-logo-text{font-family:var(--font-display);font-size:14px;font-weight:800;color:var(--text);}
.sidebar-logo-sub{font-size:10px;color:var(--text-muted);font-weight:600;}
.sidebar-section{padding:14px 10px 6px;}
.sidebar-section-label{font-size:10px;font-weight:700;color:var(--text-muted);letter-spacing:1px;text-transform:uppercase;padding:0 8px;margin-bottom:5px;}
.sidebar-link{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;font-size:13px;font-weight:500;color:var(--text-muted);transition:var(--transition);cursor:pointer;text-decoration:none;margin-bottom:2px;}
.sidebar-link:hover{background:rgba(255,255,255,.05);color:var(--text);}
.sidebar-link.active{background:rgba(255,71,87,.12);color:var(--brand-primary);font-weight:700;}
.sidebar-link span.ico{font-size:15px;flex-shrink:0;}
.sidebar-badge{margin-left:auto;background:var(--brand-primary);color:var(--text);font-size:10px;font-weight:700;padding:2px 7px;border-radius:50px;}
.admin-main{background:var(--bg);overflow-y:auto;}
.admin-topbar{position:sticky;top:0;z-index:10;background:var(--header-bg);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);padding:0 28px;height:60px;display:flex;align-items:center;justify-content:space-between;}
.admin-page-title{font-family:var(--font-display);font-size:18px;font-weight:800;color:var(--text);}
.topbar-btn{padding:8px 16px;border-radius:50px;font-size:12px;font-weight:600;background:rgba(255,255,255,.06);border:1px solid var(--border);color:var(--text-muted);cursor:pointer;transition:var(--transition);text-decoration:none;}
.topbar-btn:hover{color:var(--text);background:rgba(255,255,255,.1);}
.topbar-exit{color:var(--brand-primary);border-color:rgba(255,71,87,.3);background:rgba(255,71,87,.08);}
.admin-content{padding:28px;}
.admin-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:22px;margin-bottom:20px;}
.admin-card-title{font-size:15px;font-weight:700;color:var(--text);margin-bottom:18px;}
.admin-table{width:100%;border-collapse:collapse;font-size:13px;}
.admin-table th{font-size:11px;font-weight:700;color:var(--text-muted);text-align:left;padding:0 0 12px;border-bottom:1px solid var(--border);white-space:nowrap;}
.admin-table td{padding:12px 0;border-bottom:1px solid rgba(255,255,255,.04);color:var(--text-muted);vertical-align:middle;}
.admin-table tr:last-child td{border:none;}
.admin-table td:first-child{color:var(--text);font-weight:600;}
.s-badge{display:inline-block;font-size:10px;font-weight:700;padding:3px 9px;border-radius:50px;white-space:nowrap;}
.s-active{background:rgba(46,213,115,.15);color:#2ED573;}
.s-review{background:rgba(255,165,2,.15);color:#FFA502;}
.s-done{background:rgba(255,255,255,.08);color:var(--text-muted);}
.s-pending{background:rgba(84,160,255,.15);color:#54A0FF;}
.search-bar{display:flex;gap:10px;margin-bottom:20px;}
.search-input{flex:1;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-md);padding:11px 16px;color:var(--text);font-size:13px;font-family:var(--font-display);outline:none;}
.search-input:focus{border-color:rgba(255,71,87,.4);}
.search-input::placeholder{color:var(--text-muted);}
@media(max-width:768px){.admin-wrap{grid-template-columns:1fr;}.admin-content{padding:16px;}.admin-topbar{padding:10px 14px !important;}.admin-topbar .admin-page-title{font-size:18px !important;}.admin-topbar a.topbar-btn:not(.topbar-exit){display:none;}.adm-ham{display:inline-flex !important;}.admin-sidebar{display:block !important;position:fixed;top:0;left:0;bottom:0;width:240px;z-index:200;transform:translateX(-100%);transition:transform .28s ease;box-shadow:0 0 40px rgba(0,0,0,.5);}.admin-sidebar.open{transform:translateX(0);}.adm-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:150;}.adm-backdrop.open{display:block;}}
.admin-table td{word-break:keep-all;}
@media(max-width:768px){
  .admin-card{padding:14px;}
  .admin-table thead{display:none;}
  .admin-table,.admin-table tbody,.admin-table tr,.admin-table td{display:block;width:100%;}
  .admin-table tr{border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:12px;background:var(--bg-card2);}
  .admin-table tr:last-child td{border:none;}
  .admin-table td{border:none;padding:7px 0;display:flex;justify-content:space-between;align-items:baseline;gap:14px;text-align:right;flex-wrap:wrap;}
  .admin-table td::before{content:attr(data-label);font-size:11px;font-weight:700;color:var(--text-muted);flex-shrink:0;text-align:left;}
  .admin-table td:not([data-label]):not(:first-child)::before{content:none;}
  .admin-table td:first-child{flex-direction:column;align-items:flex-start;text-align:left;font-size:15px;padding:2px 0 10px;border-bottom:1px solid var(--border);margin-bottom:4px;}
  .admin-table td:first-child::before,.admin-table td[colspan]::before{content:none;}
  .admin-table td[colspan]{display:block;text-align:center;}
  .admin-table td>div{text-align:right;}
  .admin-table td:first-child>div{text-align:left;}
}
</style>

</script>

<style>
.cf-overlay{display:none;position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.55);align-items:flex-start;justify-content:center;padding:28px 16px;overflow:auto;}
.cf-card{background:var(--bg-card);border:1px solid var(--border);border-radius:16px;width:100%;max-width:560px;box-shadow:0 20px 60px rgba(0,0,0,.4);}
.cf-head{display:flex;align-items:center;justify-content:space-between;padding:20px 22px 14px;border-bottom:1px solid var(--border);}
.cf-title{font-size:17px;font-weight:800;color:var(--text);}
.cf-x{background:none;border:none;color:var(--text-muted);font-size:24px;line-height:1;cursor:pointer;}
.cf-body{padding:18px 22px 22px;}
.cf-l{display:block;font-size:12px;font-weight:700;color:var(--text-muted);margin:12px 0 5px;}
.cf-in{width:100%;background:var(--bg-card2,transparent);border:1px solid var(--border);border-radius:10px;padding:11px 12px;color:var(--text);font-size:14px;font-family:inherit;box-sizing:border-box;}
.cf-row{display:grid;grid-template-columns:1fr 1fr;gap:0 14px;}
.cf-prev{margin-top:8px;max-width:100%;max-height:150px;border-radius:10px;display:none;}
.cf-check{display:flex;align-items:center;gap:8px;margin-top:14px;font-size:14px;color:var(--text);font-weight:600;cursor:pointer;}
.cf-check input{width:17px;height:17px;}
.cf-actions{display:flex;align-items:center;gap:10px;margin-top:22px;padding-top:16px;border-top:1px solid var(--border);}
.cf-btn{border:none;border-radius:50px;padding:11px 20px;font-size:14px;font-weight:700;cursor:pointer;}
.cf-btn.pri{background:var(--brand-gradient);color:#fff;}
.cf-btn.ghost{background:transparent;border:1.5px solid var(--border);color:var(--text);}
.cf-del{background:transparent;border:1.5px solid rgba(255,71,87,.4);color:var(--brand-primary);border-radius:50px;padding:11px 18px;font-size:13px;font-weight:700;cursor:pointer;}
.cf-msg{display:none;font-size:13px;font-weight:600;padding:10px 12px;border-radius:10px;margin-top:12px;}
.sl-tab{background:var(--bg-card2,transparent);border:1px solid var(--border);border-radius:50px;padding:8px 16px;font-size:13px;font-weight:700;color:var(--text-muted);cursor:pointer;}

.sf-types{display:flex;gap:8px;flex-wrap:wrap;}
.sf-type{background:var(--bg-card2,transparent);border:1.5px solid var(--border);border-radius:50px;padding:9px 18px;font-size:13px;font-weight:700;color:var(--text-muted);cursor:pointer;transition:.15s;}
.sf-type.on{background:var(--brand-gradient);color:#fff;border-color:transparent;}

@media(max-width:540px){.cf-row{grid-template-columns:1fr;}}
</style>

    <div class="cf-row">
      <div><label class="cf-l">뱃지 문구</label><input id="sf-badge" class="cf-in" placeholder="방문형 캠페인"></div>
      <div><label class="cf-l">혜택 (우측 상단)</label><input id="sf-reward" class="cf-in" placeholder="9만원 상당"></div>
    </div>
    <label class="cf-l">캠페인 유형 (중복 선택 가능)</label>
    <div class="sf-types" id="sf-types">
      <button type="button" class="sf-type" data-t="방문형" onclick="slToggleType(this)">방문형</button>
      <button type="button" class="sf-type" data-t="배송형" onclick="slToggleType(this)">배송형</button>
      <button type="button" class="sf-type" data-t="원고형" onclick="slToggleType(this)">원고형</button>
    </div>
    <label class="cf-l">제목</label><input id="sf-title" class="cf-in" placeholder="청담의 밤을 더 특별하게, 품격 있는 오마카세">
    <label class="cf-l">부제</label><input id="sf-subtitle" class="cf-in" placeholder="[서울 강남] 프리미엄 한우 우진각 — 3인 세트 무료 체험">
    <label class="cf-l">캠페인 연결 (고르면 내부 링크 자동 입력)</label>
    <div class="cf-row">
      <select id="sf-camp-cat" class="cf-in" onchange="slFillCamps()"><option value="">전체 카테고리</option><option>맛집</option><option>카페</option><option>디저트</option><option>뷰티</option><option>피트니스</option><option>배송형</option><option>기타</option></select>
      <select id="sf-camp" class="cf-in" onchange="slPickCamp()"><option value="">— 캠페인 선택 —</option></select>
    </div>
    <div style="font-size:12px;color:var(--text-muted);margin:4px 0 0;">캠페인을 고르면 아래 링크가 자동으로 채워져요. 외부 링크는 아래 칸에 직접 입력하세요.</div>
    <label class="cf-l">클릭 시 이동 링크</label><input id="sf-link" class="cf-in" placeholder="pages/user/campaigns.html">
    <label class="cf-check" style="margin-top:14px;"><input type="checkbox" id="sf-always" onchange="slToggleAlways()"> 상시 노출 (기간 무제한 — 계속 노출)</label>
    <div class="cf-row" id="sf-daterow">
      <div><label class="cf-l">노출 시작일</label><input id="sf-start" class="cf-in" type="date"></div>
      <div><label class="cf-l">노출 종료일·기한</label><input id="sf-end" class="cf-in" type="date"></div>
    </div>
    <div class="cf-row">
      <div><label class="cf-l">노출 순서 (작을수록 먼저)</label><input id="sf-order" class="cf-in" type="number" placeholder="1"></div>
      <div style="display:flex;align-items:flex-end;"><label class="cf-check" style="margin-top:0;"><input type="checkbox" id="sf-active" checked> 활성화(노출)</label></div>
    </div>
    <div id="cfMsg" class="cf-msg"></div>
    <div class="cf-actions">
      <button class="cf-del" id="cfDelBtn" onclick="deleteSlideFromForm()" style="display:none;">삭제</button>
      <div style="flex:1;"></div>
      <button class="cf-btn ghost" onclick="closeSlideForm()">취소</button>
      <button class="cf-btn pri" id="cfSaveBtn" onclick="saveSlideForm()">저장</button>
    </div>
  </div>
</div></div>
<script>
function _sesc(x){return (x==null?'':String(x)).replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});}
var _slId=null; window.__slides={}; var _CAMPS=null;
function _sv(id){ return (document.getElementById(id).value||'').trim(); }
function cfMsg(t,ok){ var m=document.getElementById('cfMsg'); m.style.display='block'; m.textContent=t; m.style.background=ok?'rgba(46,213,115,.12)':'rgba(255,71,87,.12)'; m.style.color=ok?'#2ED573':'var(--brand-primary)'; }
async function slLoadCamps(){ if(_CAMPS) return; var r=await OnAuth.adminListCampaigns(); _CAMPS=(r&&r.data)||[]; }
function slFillCamps(){
  var cat=document.getElementById('sf-camp-cat').value; var sel=document.getElementById('sf-camp'); var cur=sel.value;
  var opts='<option value="">\u2014 캠페인 선택 \u2014</option>';
  (_CAMPS||[]).forEach(function(c){ if(cat && c.category!==cat) return; opts+='<option value="'+c.id+'">['+(c.category||'-')+'] '+_sesc(c.title)+'</option>'; });
  sel.innerHTML=opts; sel.value=cur;
}
function slPickCamp(){ var id=document.getElementById('sf-camp').value; if(id){ document.getElementById('sf-link').value='pages/user/campaign-detail.html?id='+id; } }
function slToggleType(b){ b.classList.toggle('on'); }
function slGetTypes(){ return Array.prototype.slice.call(document.querySelectorAll('#sf-types .sf-type.on')).map(function(x){return x.getAttribute('data-t');}); }
function slSetTypes(arr){ arr=arr||[]; document.querySelectorAll('#sf-types .sf-type').forEach(function(x){ x.classList.toggle('on', arr.indexOf(x.getAttribute('data-t'))>=0); }); }
function slToggleAlways(){ var on=document.getElementById('sf-always').checked; var row=document.getElementById('sf-daterow'); if(row) row.style.opacity=on?'.4':'1'; document.getElementById('sf-start').disabled=on; document.getElementById('sf-end').disabled=on; if(on){ document.getElementById('sf-start').value=''; document.getElementById('sf-end').value=''; } }
async function slUpload(inp){
  var f=inp.files&&inp.files[0]; if(!f) return;
  var m=document.getElementById('sf-upmsg'); m.textContent='업로드 중…';
  var r=await OnAuth.uploadPopupImage(f);
  if(r&&r.error){ m.textContent='업로드 실패: '+r.error.message; return; }
  document.getElementById('sf-image').value=r.url;
  var pv=document.getElementById('sf-prev'); pv.src=r.url; pv.style.display='block'; m.textContent='업로드 완료';
}
async function openSlideForm(id){
  _slId=id||null;
  document.getElementById('cfTitle').textContent=_slId?'광고 수정':'새 광고 등록';
  document.getElementById('cfDelBtn').style.display=_slId?'inline-block':'none';
  document.getElementById('cfMsg').style.display='none'; document.getElementById('sf-upmsg').textContent='';
  var c=_slId?window.__slides[_slId]:{};
  document.getElementById('sf-image').value=c.image_url||'';
  document.getElementById('sf-badge').value=c.badge||'';
  document.getElementById('sf-reward').value=c.reward_text||'';
  slSetTypes(c.types?c.types.split(',').filter(Boolean):(c.is_ship?['배송형']:[]));
  document.getElementById('sf-title').value=c.title||'';
  document.getElementById('sf-subtitle').value=c.subtitle||'';
  document.getElementById('sf-link').value=c.link_url||'';
  document.getElementById('sf-order').value=(c.sort_order!=null?c.sort_order:'');
  document.getElementById('sf-start').value=c.start_at?String(c.start_at).slice(0,10):'';
  document.getElementById('sf-end').value=c.end_at?String(c.end_at).slice(0,10):'';
  document.getElementById('sf-active').checked=(c.is_active!==false);
  var pv=document.getElementById('sf-prev'); if(c.image_url){ pv.src=c.image_url; pv.style.display='block'; } else { pv.style.display='none'; pv.src=''; }
  document.getElementById('sf-file').value='';
  await slLoadCamps();
  document.getElementById('sf-camp-cat').value=''; slFillCamps();
  var _m=(c.link_url||'').match(/campaign-detail\.html\?id=([0-9a-fA-F-]+)/);
  document.getElementById('sf-camp').value=_m?_m[1]:'';
  document.getElementById('sf-always').checked=(!c.start_at && !c.end_at);
  slToggleAlways();
  document.getElementById('cfOverlay').style.display='flex';
}
function closeSlideForm(){ document.getElementById('cfOverlay').style.display='none'; }
async function saveSlideForm(){
  var img=_sv('sf-image'); if(!img){ cfMsg('광고 이미지를 올려주세요.'); return; }
  var fields={ image_url:img, badge:_sv('sf-badge')||null, reward_text:_sv('sf-reward')||null,
    types:slGetTypes().join(','), is_ship:slGetTypes().indexOf('배송형')>=0, title:_sv('sf-title')||null,
    subtitle:_sv('sf-subtitle')||null, link_url:_sv('sf-link')||null,
    sort_order:parseInt(_sv('sf-order'),10)||0, is_active:document.getElementById('sf-active').checked };
  var _always=document.getElementById('sf-always').checked;
  fields.start_at=_always?null:(_sv('sf-start')||null);
  fields.end_at=_always?null:(_sv('sf-end')||null);
  var btn=document.getElementById('cfSaveBtn'); btn.disabled=true; var o=btn.textContent; btn.textContent='저장 중…';
  var r=_slId? await OnAuth.updateSlide(_slId, fields) : await OnAuth.createSlide(fields);
  btn.disabled=false; btn.textContent=o;
  if(r&&r.error){ cfMsg('저장 실패: '+r.error.message); return; }
  closeSlideForm(); loadSlides();
}
async function deleteSlideFromForm(){
  if(!_slId) return; if(!confirm('이 광고를 삭제할까요?')) return;
  var r=await OnAuth.deleteSlide(_slId);
  if(r&&r.error){ cfMsg('삭제 실패: '+r.error.message); return; }
  closeSlideForm(); loadSlides();
}
var SL_PAGE=1, SL_FILTER='all', SL_ROWS=[];
function _sd(d){ return String(d).slice(0,10).replace(/-/g,'.'); }
function slStatusOf(s){
  var today=new Date().toISOString().slice(0,10);
  if(!s.is_active) return {on:false,label:'중지'};
  if(s.start_at && s.start_at>today) return {on:false,label:'예약'};
  if(s.end_at && s.end_at<today) return {on:false,label:'기간종료'};
  return {on:true,label:'노출중'};
}
async function loadSlides(){
  var body=document.getElementById('slBody');
  var r=await OnAuth.adminListSlides();
  if(r.error){ body.innerHTML='<tr><td colspan="6" style="text-align:center;padding:30px 0;color:var(--text-muted);">불러오기 실패: '+_sesc(r.error.message)+'</td></tr>'; return; }
  SL_ROWS=r.data||[]; window.__slides={}; SL_ROWS.forEach(function(s){window.__slides[s.id]=s;});
  document.getElementById('slCount').textContent='(전체 '+SL_ROWS.length+'개)';
  var on=SL_ROWS.filter(function(s){return slStatusOf(s).on;}).length; var off=SL_ROWS.length-on;
  document.getElementById('slStat').innerHTML='<span style="color:#2ED573;">\u25CF 노출중 '+on+'</span> &nbsp; <span style="color:var(--text-muted);">\u25CF 비노출 '+off+'</span>';
  document.querySelectorAll('#slTabs .sl-tab').forEach(function(t){ var f=t.getAttribute('data-f'); var n=(f==='all')?SL_ROWS.length:(f==='on'?on:off); var bEl=t.querySelector('b'); if(bEl) bEl.textContent=n; });
  renderSlidePage();
}
function _slFiltered(){ if(SL_FILTER==='all') return SL_ROWS; return SL_ROWS.filter(function(s){ var st=slStatusOf(s); return SL_FILTER==='on'?st.on:!st.on; }); }
function renderSlidePage(){
  var rows=_slFiltered(); var PER=10; var pages=Math.max(1,Math.ceil(rows.length/PER));
  if(SL_PAGE>pages) SL_PAGE=pages; if(SL_PAGE<1) SL_PAGE=1;
  var body=document.getElementById('slBody'), pager=document.getElementById('slPager');
  if(!rows.length){ body.innerHTML='<tr><td colspan="6" style="text-align:center;padding:34px 0;color:var(--text-muted);">해당하는 광고가 없어요.</td></tr>'; pager.innerHTML=''; return; }
  var slice=rows.slice((SL_PAGE-1)*PER, SL_PAGE*PER);
  body.innerHTML=slice.map(function(c){
    var st=slStatusOf(c);
    var thumb=c.image_url?'<img src="'+_sesc(c.image_url)+'" style="width:52px;height:34px;border-radius:6px;object-fit:cover;vertical-align:-10px;margin-right:8px;">':'';
    var badge=st.on?'<span class="s-badge s-active">노출중</span>':'<span class="s-badge s-done">'+st.label+'</span>';
    var period=(c.start_at||c.end_at)?((c.start_at?_sd(c.start_at):'~')+' ~ '+(c.end_at?_sd(c.end_at):'무기한')):'상시';
    return '<tr>'
      +'<td>'+thumb+_sesc(c.title||'(제목 없음)')+'</td>'
      +'<td data-label="유형" style="color:var(--text-muted);">'+_sesc(c.types||c.badge||'-')+'</td>'
      +'<td data-label="노출기간" style="color:var(--text-muted);">'+period+'</td>'
      +'<td data-label="순서" style="color:var(--text-muted);">'+(c.sort_order||0)+'</td>'
      +'<td data-label="상태">'+badge+'</td>'
      +'<td data-label="관리" style="white-space:nowrap;"><a href="#" class="sl-edit" data-id="'+c.id+'" style="color:var(--brand-primary);font-size:12px;font-weight:700;">수정</a> <a href="#" class="sl-toggle" data-id="'+c.id+'" style="color:var(--text-muted);font-size:12px;font-weight:700;margin-left:8px;">'+(c.is_active?'중지':'노출')+'</a></td>'
      +'</tr>';
  }).join('');
  body.querySelectorAll('.sl-edit').forEach(function(a){ a.addEventListener('click',function(e){ e.preventDefault(); openSlideForm(this.getAttribute('data-id')); }); });
  body.querySelectorAll('.sl-toggle').forEach(function(a){ a.addEventListener('click',async function(e){ e.preventDefault(); var id=this.getAttribute('data-id'); var c=window.__slides[id]; var rr=await OnAuth.updateSlide(id,{is_active:!c.is_active}); if(rr&&rr.error){ alert('실패: '+rr.error.message); return; } loadSlides(); }); });
  if(pages<=1){ pager.innerHTML=''; }
  else { var h=''; for(var i=1;i<=pages;i++){ h+='<button class="'+(i===SL_PAGE?'active':'')+'" data-p="'+i+'">'+i+'</button>'; } pager.innerHTML=h; pager.querySelectorAll('button').forEach(function(bn){ bn.onclick=function(){ SL_PAGE=parseInt(this.getAttribute('data-p'),10); renderSlidePage(); window.scrollTo(0,0); }; }); }
}
(function(){ var tabs=document.querySelectorAll('#slTabs .sl-tab'); tabs.forEach(function(t){ t.addEventListener('click',function(){ tabs.forEach(function(x){x.classList.remove('active');}); this.classList.add('active'); SL_FILTER=this.getAttribute('data-f'); SL_PAGE=1; renderSlidePage(); }); }); })();
document.addEventListener('click',function(e){ if(e.target&&e.target.id==='cfOverlay') closeSlideForm(); });
window.__adminReady = loadSlides;
</script>
<script>
document.addEventListener('click',function(e){
  var a=e.target.closest?e.target.closest('a.sidebar-link'):null;
  if(a && a.getAttribute('href')==='#'){ e.preventDefault(); alert('준비 중인 기능이에요. 곧 추가됩니다!'); }
});
</script>
<script src="../../assets/js/pwa.js" defer></script>
<script src="../../assets/js/platform.js" defer></script>
</body></html>
