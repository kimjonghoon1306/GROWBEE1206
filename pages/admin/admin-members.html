<link rel="stylesheet" href="../../assets/css/design-system.css">
<style>
body{--bg:#1B1E27;--bg-surface:#222633;--bg-card:#2A2F3E;--bg-card2:#323848;--border:rgba(255,255,255,0.12);--text:#F4F5F8;--text-muted:#AEB4C2;--shadow:0 4px 24px rgba(0,0,0,.35);--shadow-card:0 8px 32px rgba(0,0,0,.4);--header-bg:rgba(27,30,39,0.95);--nav-active-bg:rgba(255,255,255,0.08);}body.light{--bg:#FBF8F2;--bg-surface:#FFFFFF;--bg-card:#FFFFFF;--bg-card2:#F5F1E8;--border:rgba(0,0,0,.09);--text:#2A241F;--text-muted:#877E72;--shadow:0 6px 22px rgba(60,42,20,.07);--shadow-card:0 16px 44px rgba(60,42,20,.11);--header-bg:rgba(251,248,242,.95);--nav-active-bg:rgba(236,58,102,.08);}
.admin-wrap{display:grid;grid-template-columns:220px 1fr;min-height:100vh;}
.admin-sidebar{background:var(--bg-surface);border-right:1px solid var(--border);padding:0;position:sticky;top:0;height:100vh;overflow-y:auto;}
.sidebar-logo{padding:18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;}
.sidebar-logo-mark{width:30px;height:30px;border-radius:9px;background:var(--brand-gradient);display:flex;align-items:center;justify-content:center;}
.sidebar-logo-mark svg{width:16px;height:16px;}
.sidebar-logo-text{font-family:var(--font-display);font-size:14px;font-weight:800;color:var(--text);}
.sidebar-logo-sub{font-size:10px;color:var(--text-muted);font-weight:600;}
.sidebar-section{padding:14px 10px 6px;}
.sidebar-section-label{font-size:10px;font-weight:700;color:var(--text-muted);letter-spacing:1px;text-transform:uppercase;padding:0 8px;margin-bottom:5px;}
.sidebar-link{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;font-size:13px;font-weight:500;color:var(--text-muted);transition:var(--transition);cursor:pointer;text-decoration:none;margin-bottom:2px;}
.sidebar-link:hover{background:rgba(255,255,255,.05);color:var(--text);}
.sidebar-link.active{background:rgba(255,71,87,.12);color:var(--brand-primary);font-weight:700;}
.sidebar-link span.ico{font-size:15px;flex-shrink:0;}
.sidebar-badge{margin-left:auto;background:var(--brand-primary);color:var(--text);font-size:10px;font-weight:700;padding:2px 7px;border-radius:50px;}
.admin-main{background:var(--bg);overflow-y:auto;}
.admin-topbar{position:sticky;top:0;z-index:10;background:var(--header-bg);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);padding:0 28px;height:60px;display:flex;align-items:center;justify-content:space-between;}
.admin-page-title{font-family:var(--font-display);font-size:18px;font-weight:800;color:var(--text);}
.topbar-btn{padding:8px 16px;border-radius:50px;font-size:12px;font-weight:600;background:rgba(255,255,255,.06);border:1px solid var(--border);color:var(--text-muted);cursor:pointer;transition:var(--transition);text-decoration:none;}
.topbar-btn:hover{color:var(--text);background:rgba(255,255,255,.1);}
.topbar-exit{color:var(--brand-primary);border-color:rgba(255,71,87,.3);background:rgba(255,71,87,.08);}
.admin-content{padding:28px;}
.admin-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:22px;margin-bottom:20px;}
.admin-card-title{font-size:15px;font-weight:700;color:var(--text);margin-bottom:18px;}
.admin-table{width:100%;border-collapse:collapse;font-size:13px;}
.admin-table th{font-size:11px;font-weight:700;color:var(--text-muted);text-align:left;padding:0 0 12px;border-bottom:1px solid var(--border);white-space:nowrap;}
.admin-table td{padding:12px 0;border-bottom:1px solid rgba(255,255,255,.04);color:var(--text-muted);vertical-align:middle;}
.admin-table tr:last-child td{border:none;}
.admin-table td:first-child{color:var(--text);font-weight:600;}
.s-badge{display:inline-block;font-size:10px;font-weight:700;padding:3px 9px;border-radius:50px;white-space:nowrap;}
.s-active{background:rgba(46,213,115,.15);color:#2ED573;}
.s-review{background:rgba(255,165,2,.15);color:#FFA502;}
.s-done{background:rgba(255,255,255,.08);color:var(--text-muted);}
.s-pending{background:rgba(84,160,255,.15);color:#54A0FF;}
.search-bar{display:flex;gap:10px;margin-bottom:20px;}
.search-input{flex:1;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-md);padding:11px 16px;color:var(--text);font-size:13px;font-family:var(--font-display);outline:none;}
.search-input:focus{border-color:rgba(255,71,87,.4);}
.search-input::placeholder{color:var(--text-muted);}
@media(max-width:768px){.admin-wrap{grid-template-columns:1fr;}.admin-content{padding:16px;}.admin-topbar{padding:10px 14px !important;}.admin-topbar .admin-page-title{font-size:18px !important;}.admin-topbar a.topbar-btn:not(.topbar-exit){display:none;}.adm-ham{display:inline-flex !important;}.admin-sidebar{display:block !important;position:fixed;top:0;left:0;bottom:0;width:240px;z-index:200;transform:translateX(-100%);transition:transform .28s ease;box-shadow:0 0 40px rgba(0,0,0,.5);}.admin-sidebar.open{transform:translateX(0);}.adm-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:150;}.adm-backdrop.open{display:block;}}
.admin-table td{word-break:keep-all;}
@media(max-width:768px){
  .admin-card{padding:14px;}
  .admin-table thead{display:none;}
  .admin-table,.admin-table tbody,.admin-table tr,.admin-table td{display:block;width:100%;}
  .admin-table tr{border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:12px;background:var(--bg-card2);}
  .admin-table tr:last-child td{border:none;}
  .admin-table td{border:none;padding:7px 0;display:flex;justify-content:space-between;align-items:baseline;gap:14px;text-align:right;flex-wrap:wrap;}
  .admin-table td::before{content:attr(data-label);font-size:11px;font-weight:700;color:var(--text-muted);flex-shrink:0;text-align:left;}
  .admin-table td:not([data-label]):not(:first-child)::before{content:none;}
  .admin-table td:first-child{flex-direction:column;align-items:flex-start;text-align:left;font-size:15px;padding:2px 0 10px;border-bottom:1px solid var(--border);margin-bottom:4px;}
  .admin-table td:first-child::before,.admin-table td[colspan]::before{content:none;}
  .admin-table td[colspan]{display:block;text-align:center;}
  .admin-table td>div{text-align:right;}
  .admin-table td:first-child>div{text-align:left;}
}
</style>

<script>
function esc(s){return (s==null?'':String(s)).replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});}
function fmtDate(iso){ if(!iso) return '-'; var d=new Date(iso); return (''+d.getFullYear()).slice(2)+'.'+('0'+(d.getMonth()+1)).slice(-2)+'.'+('0'+d.getDate()).slice(-2); }
function fmtPhone(p){ if(!p) return '-'; p=(''+p).replace(/[^0-9]/g,''); if(p.length===11) return p.slice(0,3)+'-'+p.slice(3,7)+'-'+p.slice(7); return p; }
var MEM_ALL=[], MEM_PAGE=1, MEM_PER=20;
window.__adminReady = async function(){
  var body=document.getElementById('memBody');
  var r=await OnAuth.listMembers();
  if(r.error){ body.innerHTML='<tr><td colspan="7" style="text-align:center;padding:30px 0;color:var(--text-muted);">불러오기 실패: '+esc(r.error.message)+'</td></tr>'; return; }
  MEM_ALL=r.data||[];
  window.__members={}; MEM_ALL.forEach(function(m){ window.__members[m.id]=m; });
  var si=document.getElementById('memSearch'), fs=document.getElementById('memFilter');
  if(si) si.oninput=function(){ MEM_PAGE=1; renderMembers(); };
  if(fs) fs.onchange=function(){ MEM_PAGE=1; renderMembers(); };
  renderMembers();
};
function _memFiltered(){
  var q=(document.getElementById('memSearch').value||'').toLowerCase().trim();
  var f=document.getElementById('memFilter').value;
  return MEM_ALL.filter(function(m){
    if(f==='active'&&m.suspended) return false;
    if(f==='suspended'&&!m.suspended) return false;
    if(!q) return true;
    return ((m.name||'')+(m.nickname||'')+(m.email||'')+(m.phone||'')).toLowerCase().indexOf(q)>=0;
  });
}
function renderMembers(){
  var body=document.getElementById('memBody'), pager=document.getElementById('memPager');
  var rows=_memFiltered();
  document.getElementById('memCount').textContent='('+rows.length.toLocaleString()+'명'+(rows.length!==MEM_ALL.length?(' / 전체 '+MEM_ALL.length):'')+')';
  var pages=Math.max(1,Math.ceil(rows.length/MEM_PER));
  if(MEM_PAGE>pages) MEM_PAGE=pages;
  if(!rows.length){ body.innerHTML='<tr><td colspan="7" style="text-align:center;padding:30px 0;color:var(--text-muted);">해당하는 회원이 없어요.</td></tr>'; pager.innerHTML=''; return; }
  var slice=rows.slice((MEM_PAGE-1)*MEM_PER, MEM_PAGE*MEM_PER);
  body.innerHTML = slice.map(function(m){
    var nm = esc(m.name||'-') + (m.nickname? ' / '+esc(m.nickname) : '') + (m.suspended? ' <span class="mv-susp">정지</span>' : '');
    return '<tr data-uid="'+m.id+'">'
      +'<td>'+nm+'</td>'
      +'<td data-label="이메일" style="color:var(--text-muted);">'+esc(m.email)+'</td>'
      +'<td data-label="휴대폰" style="color:var(--text-muted);">'+fmtPhone(m.phone)+'</td>'
      +'<td data-label="채널" style="color:var(--text-muted);">'+esc(m.channel_type||'-')+'</td>'
      +'<td data-label="포인트" style="color:var(--text-muted);">'+((m.points||0).toLocaleString())+' P</td>'
      +'<td data-label="가입일" style="color:var(--text-muted);">'+fmtDate(m.created_at)+'</td>'
      +'<td data-label="관리"><a href="#" class="mv-view" data-uid="'+m.id+'" style="color:var(--brand-primary);font-size:12px;font-weight:600;">보기</a></td>'
      +'</tr>';
  }).join('');
  body.querySelectorAll('.mv-view').forEach(function(a){ a.addEventListener('click', function(e){ e.preventDefault(); openMember(this.getAttribute('data-uid')); }); });
  if(pages<=1){ pager.innerHTML=''; }
  else { var h=''; for(var i=1;i<=pages;i++){ h+='<button class="'+(i===MEM_PAGE?'active':'')+'" data-p="'+i+'">'+i+'</button>'; } pager.innerHTML=h; pager.querySelectorAll('button').forEach(function(bn){ bn.onclick=function(){ MEM_PAGE=parseInt(this.getAttribute('data-p'),10); renderMembers(); }; }); }
}
</script>

.mv-susp{display:inline-block;font-size:10px;font-weight:700;padding:2px 7px;border-radius:50px;background:rgba(255,71,87,.15);color:var(--brand-primary);margin-left:6px;vertical-align:1px;}
.mv-overlay{display:none;position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.55);align-items:center;justify-content:center;padding:20px;}
.mv-card{background:var(--bg-card);border:1px solid var(--border);border-radius:16px;width:100%;max-width:560px;max-height:88vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.4);}
.mv-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:22px 22px 14px;border-bottom:1px solid var(--border);}
.mv-h-name{font-size:18px;font-weight:800;color:var(--text);}
.mv-h-sub{font-size:13px;color:var(--text-muted);margin-top:3px;}
.mv-x{background:none;border:none;color:var(--text-muted);font-size:22px;line-height:1;cursor:pointer;padding:2px 6px;}
.mv-body{padding:18px 22px 24px;}
.mv-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;margin-bottom:18px;}
.mv-f{font-size:11px;color:var(--text-muted);font-weight:700;letter-spacing:.3px;text-transform:uppercase;}
.mv-v{font-size:14px;color:var(--text);margin-top:2px;font-weight:600;}
.mv-sec-t{font-size:13px;font-weight:700;color:var(--text);margin:14px 0 8px;}
.mv-list{border:1px solid var(--border);border-radius:10px;overflow:hidden;}
.mv-li{display:flex;justify-content:space-between;gap:10px;padding:10px 12px;font-size:13px;border-top:1px solid var(--border);}
.mv-li:first-child{border-top:none;}
.mv-li .l{color:var(--text);}
.mv-li .m{color:var(--text-muted);font-size:11px;margin-top:2px;}
.mv-empty{padding:16px 12px;color:var(--text-muted);font-size:13px;text-align:center;}
.mv-grant{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;}
.mv-grant input{background:var(--bg-card2,transparent);border:1px solid var(--border);border-radius:10px;padding:11px 12px;color:var(--text);font-size:14px;font-family:inherit;}
.mv-grant input#mvAmount{width:120px;}
.mv-grant input#mvReason{flex:1;min-width:140px;}
.mv-btn{border:none;border-radius:50px;padding:11px 18px;font-size:13px;font-weight:700;cursor:pointer;}
.mv-btn.pri{background:var(--brand-gradient);color:#fff;}
.mv-btn.warn{background:transparent;border:1.5px solid var(--border);color:var(--text);}
.mv-btn.ghost{background:transparent;border:1.5px solid var(--border);color:var(--text-muted);}
.mv-btn.danger{background:transparent;border:1.5px solid rgba(255,71,87,.5);color:var(--brand-primary);}
.mv-btn.danger:hover{background:var(--brand-primary);color:#fff;}
.mv-in{width:100%;box-sizing:border-box;background:var(--bg-card2,transparent);border:1px solid var(--border);border-radius:10px;padding:11px 12px;color:var(--text);font-size:14px;font-family:inherit;}
.mv-seg{display:flex;gap:0;border:1.5px solid var(--border);border-radius:12px;overflow:hidden;margin-top:6px;}
.mv-seg-btn{flex:1;background:transparent;border:none;padding:10px;font-size:13px;font-weight:800;color:var(--text-muted);cursor:pointer;}
.mv-seg-btn.on{background:var(--brand-gradient);color:#fff;}
.mv-chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;}
.mv-chip{background:var(--bg-card2,transparent);border:1.5px solid var(--border);border-radius:50px;padding:7px 13px;font-size:13px;font-weight:700;color:var(--text-muted);cursor:pointer;}
.mv-chip.on{background:rgba(236,58,102,.12);border-color:var(--brand-primary);color:var(--brand-primary);}
.mv-actions{display:flex;justify-content:space-between;gap:10px;margin-top:22px;padding-top:16px;border-top:1px solid var(--border);flex-wrap:wrap;}
@media(max-width:520px){.mv-grid{grid-template-columns:1fr;}}
</style>
<div class="mv-overlay" id="mvOverlay">
  <div class="mv-card">
    <div class="mv-head">
      <div><div class="mv-h-name" id="mvName">-</div><div class="mv-h-sub" id="mvSub">-</div></div>
      <button class="mv-x" onclick="closeMember()">&times;</button>
    </div>
    <div class="mv-body">
      <div class="mv-grid">
        <div><div class="mv-f">휴대폰</div><div class="mv-v" id="mvPhone">-</div></div>
        <div><div class="mv-f">채널</div><div class="mv-v" id="mvChannel">-</div></div>
        <div><div class="mv-f">보유 포인트</div><div class="mv-v" id="mvPoints">0 P</div></div>
        <div><div class="mv-f">가입일</div><div class="mv-v" id="mvJoined">-</div></div>
      </div>
      <div class="mv-sec-t">포인트 지급 / 차감</div>
      <!-- 1) 지급/차감 선택 -->
      <div class="mv-seg" id="mvMode">
        <button type="button" class="mv-seg-btn on" data-mode="grant" onclick="mvSetMode('grant')">＋ 지급</button>
        <button type="button" class="mv-seg-btn" data-mode="deduct" onclick="mvSetMode('deduct')">－ 차감</button>
      </div>
      <!-- 2) 금액 프리셋 + 직접입력 -->
      <div class="mv-chips" id="mvAmtChips"></div>
      <input id="mvAmount" type="number" class="mv-in" placeholder="직접 입력 (숫자만)" style="margin-top:8px;">
      <!-- 3) 사유 드롭다운(자동선택) + 직접입력 -->
      <select id="mvReasonSel" class="mv-in" style="margin-top:8px;" onchange="mvReasonChange()">
        <option value="">사유를 선택하세요</option>
      </select>
      <input id="mvReason" type="text" class="mv-in" placeholder="사유 직접 입력" style="margin-top:8px;display:none;">
      <button class="mv-btn pri" id="mvGrantBtn" onclick="doGrant(this)" style="width:100%;margin-top:10px;">포인트 지급하기</button>

      <div class="mv-sec-t">신청한 캠페인</div>
      <div id="mvApps" class="mv-list"><div class="mv-empty">불러오는 중…</div></div>
      <div class="mv-sec-t">포인트 내역</div>
      <div id="mvTx" class="mv-list"><div class="mv-empty">불러오는 중…</div></div>
      <div class="mv-actions">
        <button class="mv-btn warn" id="mvSuspendBtn" onclick="doSuspend(this)">회원 정지</button>
        <button class="mv-btn danger" id="mvDeleteBtn" onclick="doDelete(this)">회원 삭제</button>
        <button class="mv-btn ghost" onclick="closeMember()">닫기</button>
      </div>
    </div>
  </div>
</div>
<script>
var ST={applied:'신청중',selected:'선정됨',reviewing:'리뷰대기',completed:'리뷰완료',rejected:'미선정'};
var KD={reward:'리뷰적립',manuscript:'원고료',invite:'친구초대',store:'스토어',withdraw:'출금',admin:'관리자'};
function _esc(x){return (x==null?'':String(x)).replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});}
function _fd(d){return d?String(d).slice(0,10).replace(/-/g,'.'):'';}
function openMember(uid){
  var m=window.__members[uid]; if(!m) return;
  document.getElementById('mvName').textContent=(m.name||'-')+(m.nickname?(' / '+m.nickname):'');
  document.getElementById('mvSub').textContent=m.email||'';
  document.getElementById('mvPhone').textContent=fmtPhone(m.phone);
  document.getElementById('mvChannel').textContent=m.channel_type||'-';
  document.getElementById('mvPoints').textContent=(m.points||0).toLocaleString()+' P';
  document.getElementById('mvJoined').textContent=fmtDate(m.created_at);
  var sbBtn=document.getElementById('mvSuspendBtn'); sbBtn.textContent=m.suspended?'정지 해제':'회원 정지'; sbBtn.dataset.uid=uid; sbBtn.dataset.on=m.suspended?'1':'0';
  document.getElementById('mvGrantBtn').dataset.uid=uid;
  document.getElementById('mvDeleteBtn').dataset.uid=uid;
  document.getElementById('mvAmount').value=''; document.getElementById('mvReason').value='';
  document.getElementById('mvReason').style.display='none';
  mvSetMode('grant');
  document.getElementById('mvOverlay').style.display='flex';
  loadMemberDetail(uid);
}
// 지급/차감 사유 프리셋 (자동 선택)
var MV_REASONS={
  grant:[['리뷰 적립','리뷰 적립'],['원고료 지급','원고료 지급'],['이벤트 보상','이벤트 보상'],['친구초대 보너스','친구초대 보너스'],['고객 보상','고객 보상'],['오류 보정(지급)','오류 보정']],
  deduct:[['미션 미이행 차감','미션 미이행 차감'],['부정 적립 회수','부정 적립 회수'],['출금 처리','출금 처리'],['오류 보정(차감)','오류 보정']]
};
var MV_AMOUNTS=[100,500,1000,3000,5000,10000];
var _mvMode='grant', _mvAmt=0;
function mvSetMode(mode){
  _mvMode=mode; _mvAmt=0;
  document.querySelectorAll('#mvMode .mv-seg-btn').forEach(function(b){ b.classList.toggle('on', b.dataset.mode===mode); });
  document.getElementById('mvGrantBtn').textContent=(mode==='grant'?'포인트 지급하기':'포인트 차감하기');
  // 금액 칩
  var chips=document.getElementById('mvAmtChips');
  chips.innerHTML=MV_AMOUNTS.map(function(a){return '<button type="button" class="mv-chip" data-a="'+a+'">'+(mode==='deduct'?'-':'+')+a.toLocaleString()+'P</button>';}).join('');
  chips.querySelectorAll('.mv-chip').forEach(function(c){ c.onclick=function(){ chips.querySelectorAll('.mv-chip').forEach(function(x){x.classList.remove('on');}); this.classList.add('on'); _mvAmt=parseInt(this.getAttribute('data-a'),10); document.getElementById('mvAmount').value=''; }; });
  document.getElementById('mvAmount').value='';
  // 사유 드롭다운
  var sel=document.getElementById('mvReasonSel');
  sel.innerHTML='<option value="">사유를 선택하세요</option>'+MV_REASONS[mode].map(function(r){return '<option value="'+r[1]+'">'+r[0]+'</option>';}).join('')+'<option value="__custom">직접 입력…</option>';
  document.getElementById('mvReason').style.display='none'; document.getElementById('mvReason').value='';
}
function mvReasonChange(){
  var v=document.getElementById('mvReasonSel').value;
  document.getElementById('mvReason').style.display=(v==='__custom')?'block':'none';
}
async function loadMemberDetail(uid){
  var appsEl=document.getElementById('mvApps'), txEl=document.getElementById('mvTx');
  var apps=await OnAuth.memberApplications(uid);
  appsEl.innerHTML = apps.length ? apps.map(function(a){var c=a.campaigns||{};return '<div class="mv-li"><div><div class="l">'+_esc(c.title||'-')+'</div><div class="m">'+_fd(a.created_at)+(c.region?(' · '+_esc(c.region)):'')+'</div></div><div class="l">'+(ST[a.status]||a.status)+'</div></div>';}).join('') : '<div class="mv-empty">신청한 캠페인이 없습니다.</div>';
  var tx=await OnAuth.memberPointTx(uid);
  txEl.innerHTML = tx.length ? tx.map(function(t){var pos=t.amount>0;return '<div class="mv-li"><div><div class="l">'+_esc(t.title||('['+(KD[t.kind]||'적립')+']'))+'</div><div class="m">'+_fd(t.created_at)+'</div></div><div class="l" style="'+(pos?'color:#2FA46A;':'')+'">'+(pos?'+':'')+t.amount.toLocaleString()+' P</div></div>';}).join('') : '<div class="mv-empty">포인트 내역이 없습니다.</div>';
}
function closeMember(){ document.getElementById('mvOverlay').style.display='none'; }
function refreshRow(uid){
  var m=window.__members[uid]; var tr=document.querySelector('#memBody tr[data-uid="'+uid+'"]'); if(!tr) return;
  var tds=tr.querySelectorAll('td');
  tds[0].innerHTML = esc(m.name||'-')+(m.nickname?(' / '+esc(m.nickname)):'')+(m.suspended?' <span class="mv-susp">정지</span>':'');
  tds[4].textContent=(m.points||0).toLocaleString()+' P';
}
async function doGrant(btn){
  var uid=btn.dataset.uid;
  var typed=parseInt(document.getElementById('mvAmount').value,10);
  var base=typed||_mvAmt;
  if(!base||base<=0){ alert('금액을 선택하거나 직접 입력해주세요.'); return; }
  var amt=(_mvMode==='deduct')? -Math.abs(base) : Math.abs(base);
  var sel=document.getElementById('mvReasonSel').value;
  var reason = sel==='__custom' ? (document.getElementById('mvReason').value||'').trim() : sel;
  if(!reason){ alert('사유를 선택하거나 입력해주세요.'); return; }
  if(!confirm((_mvMode==='deduct'?'차감':'지급')+': '+Math.abs(amt).toLocaleString()+'P\n사유: '+reason+'\n진행할까요?')) return;
  var o=btn.textContent; btn.disabled=true; btn.textContent='처리 중…';
  var res=await OnAuth.grantPoints(uid, amt, reason, 'admin');
  btn.disabled=false; btn.textContent=o;
  if(res&&res.ok){
    var m=window.__members[uid]; m.points=(m.points||0)+amt;
    document.getElementById('mvPoints').textContent=m.points.toLocaleString()+' P';
    mvSetMode(_mvMode); refreshRow(uid); loadMemberDetail(uid);
    alert((_mvMode==='deduct'?'차감':'지급')+' 완료: '+Math.abs(amt).toLocaleString()+' P');
  } else alert((res&&res.msg)||'처리에 실패했습니다.');
}
async function doDelete(btn){
  var uid=btn.dataset.uid; var m=window.__members[uid];
  if(!confirm('⚠️ '+(m.name||'이 회원')+' 님을 완전히 삭제할까요?\n\n신청·포인트·계정이 모두 삭제되며 되돌릴 수 없습니다.')) return;
  if(!confirm('정말 삭제하시겠어요? 마지막 확인입니다.')) return;
  btn.disabled=true; var o=btn.textContent; btn.textContent='삭제 중…';
  var res=await OnAuth.deleteMember(uid);
  btn.disabled=false; btn.textContent=o;
  if(res&&res.ok){
    var tr=document.querySelector('#memBody tr[data-uid="'+uid+'"]'); if(tr) tr.remove();
    delete window.__members[uid];
    closeMember();
    alert('회원이 삭제되었습니다.');
  } else alert((res&&res.msg)||'삭제에 실패했습니다.');
}
async function doSuspend(btn){
  var uid=btn.dataset.uid; var on=btn.dataset.on==='1';
  if(!confirm(on?'정지를 해제할까요?':'이 회원을 정지할까요?\n정지 시 로그인·이용이 차단됩니다.')) return;
  btn.disabled=true;
  var res=await OnAuth.setSuspended(uid, !on);
  btn.disabled=false;
  if(res&&res.ok){ window.__members[uid].suspended=!on; refreshRow(uid); openMember(uid); alert(on?'정지를 해제했습니다.':'회원을 정지했습니다.'); }
  else alert((res&&res.msg)||'처리에 실패했습니다.');
}
document.addEventListener('click',function(e){ if(e.target&&e.target.id==='mvOverlay') closeMember(); });
</script>
<script>
document.addEventListener('click',function(e){
  var a=e.target.closest?e.target.closest('a.sidebar-link'):null;
  if(a && a.getAttribute('href')==='#'){ e.preventDefault(); alert('준비 중인 기능이에요. 곧 추가됩니다!'); }
});
</script>
<script src="../../assets/js/pwa.js" defer></script>
<script src="../../assets/js/platform.js" defer></script>
</body></html>
