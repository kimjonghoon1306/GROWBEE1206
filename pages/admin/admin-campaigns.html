<link rel="stylesheet" href="../../assets/css/design-system.css">
<style>
body{--bg:#1B1E27;--bg-surface:#222633;--bg-card:#2A2F3E;--bg-card2:#323848;--border:rgba(255,255,255,0.12);--text:#F4F5F8;--text-muted:#AEB4C2;--shadow:0 4px 24px rgba(0,0,0,.35);--shadow-card:0 8px 32px rgba(0,0,0,.4);--header-bg:rgba(27,30,39,0.95);--nav-active-bg:rgba(255,255,255,0.08);}body.light{--bg:#FBF8F2;--bg-surface:#FFFFFF;--bg-card:#FFFFFF;--bg-card2:#F5F1E8;--border:rgba(0,0,0,.09);--text:#2A241F;--text-muted:#877E72;--shadow:0 6px 22px rgba(60,42,20,.07);--shadow-card:0 16px 44px rgba(60,42,20,.11);--header-bg:rgba(251,248,242,.95);--nav-active-bg:rgba(236,58,102,.08);}
.admin-wrap{display:grid;grid-template-columns:220px 1fr;min-height:100vh;}
.admin-sidebar{background:var(--bg-surface);border-right:1px solid var(--border);padding:0;position:sticky;top:0;height:100vh;overflow-y:auto;}
.sidebar-logo{padding:18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;}
.sidebar-logo-mark{width:30px;height:30px;border-radius:9px;background:var(--brand-gradient);display:flex;align-items:center;justify-content:center;}
.sidebar-logo-mark svg{width:16px;height:16px;}
.sidebar-logo-text{font-family:var(--font-display);font-size:14px;font-weight:800;color:var(--text);}
.sidebar-logo-sub{font-size:10px;color:var(--text-muted);font-weight:600;}
.sidebar-section{padding:14px 10px 6px;}
.sidebar-section-label{font-size:10px;font-weight:700;color:var(--text-muted);letter-spacing:1px;text-transform:uppercase;padding:0 8px;margin-bottom:5px;}
.sidebar-link{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;font-size:13px;font-weight:500;color:var(--text-muted);transition:var(--transition);cursor:pointer;text-decoration:none;margin-bottom:2px;}
.sidebar-link:hover{background:rgba(255,255,255,.05);color:var(--text);}
.sidebar-link.active{background:rgba(255,71,87,.12);color:var(--brand-primary);font-weight:700;}
.sidebar-link span.ico{font-size:15px;flex-shrink:0;}
.sidebar-badge{margin-left:auto;background:var(--brand-primary);color:var(--text);font-size:10px;font-weight:700;padding:2px 7px;border-radius:50px;}
.admin-main{background:var(--bg);overflow-y:auto;}
.admin-topbar{position:sticky;top:0;z-index:10;background:var(--header-bg);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);padding:0 28px;height:60px;display:flex;align-items:center;justify-content:space-between;}
.admin-page-title{font-family:var(--font-display);font-size:18px;font-weight:800;color:var(--text);}
.topbar-btn{padding:8px 16px;border-radius:50px;font-size:12px;font-weight:600;background:rgba(255,255,255,.06);border:1px solid var(--border);color:var(--text-muted);cursor:pointer;transition:var(--transition);text-decoration:none;}
.topbar-btn:hover{color:var(--text);background:rgba(255,255,255,.1);}
.topbar-exit{color:var(--brand-primary);border-color:rgba(255,71,87,.3);background:rgba(255,71,87,.08);}
.admin-content{padding:28px;}
.admin-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:22px;margin-bottom:20px;}
.admin-card-title{font-size:15px;font-weight:700;color:var(--text);margin-bottom:18px;}
.admin-table{width:100%;border-collapse:collapse;font-size:13px;}
.admin-table th{font-size:11px;font-weight:700;color:var(--text-muted);text-align:left;padding:0 0 12px;border-bottom:1px solid var(--border);white-space:nowrap;}
.admin-table td{padding:12px 0;border-bottom:1px solid rgba(255,255,255,.04);color:var(--text-muted);vertical-align:middle;}
.admin-table tr:last-child td{border:none;}
.admin-table td:first-child{color:var(--text);font-weight:600;}
.s-badge{display:inline-block;font-size:10px;font-weight:700;padding:3px 9px;border-radius:50px;white-space:nowrap;}
.s-active{background:rgba(46,213,115,.15);color:#2ED573;}
.s-review{background:rgba(255,165,2,.15);color:#FFA502;}
.s-done{background:rgba(255,255,255,.08);color:var(--text-muted);}
.s-pending{background:rgba(84,160,255,.15);color:#54A0FF;}
.search-bar{display:flex;gap:10px;margin-bottom:20px;}
.search-input{flex:1;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-md);padding:11px 16px;color:var(--text);font-size:13px;font-family:var(--font-display);outline:none;}
.search-input:focus{border-color:rgba(255,71,87,.4);}
.search-input::placeholder{color:var(--text-muted);}
@media(max-width:768px){.admin-wrap{grid-template-columns:1fr;}.admin-content{padding:16px;}.admin-topbar{padding:10px 14px !important;}.admin-topbar .admin-page-title{font-size:18px !important;}.admin-topbar a.topbar-btn:not(.topbar-exit){display:none;}.adm-ham{display:inline-flex !important;}.admin-sidebar{display:block !important;position:fixed;top:0;left:0;bottom:0;width:240px;z-index:200;transform:translateX(-100%);transition:transform .28s ease;box-shadow:0 0 40px rgba(0,0,0,.5);}.admin-sidebar.open{transform:translateX(0);}.adm-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:150;}.adm-backdrop.open{display:block;}}
.admin-table td{word-break:keep-all;}
@media(max-width:768px){
  .admin-card{padding:14px;}
  .admin-table thead{display:none;}
  .admin-table,.admin-table tbody,.admin-table tr,.admin-table td{display:block;width:100%;}
  .admin-table tr{border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:12px;background:var(--bg-card2);}
  .admin-table tr:last-child td{border:none;}
  .admin-table td{border:none;padding:7px 0;display:flex;justify-content:space-between;align-items:baseline;gap:14px;text-align:right;flex-wrap:wrap;}
  .admin-table td::before{content:attr(data-label);font-size:11px;font-weight:700;color:var(--text-muted);flex-shrink:0;text-align:left;}
  .admin-table td:not([data-label]):not(:first-child)::before{content:none;}
  .admin-table td:first-child{flex-direction:column;align-items:flex-start;text-align:left;font-size:15px;padding:2px 0 10px;border-bottom:1px solid var(--border);margin-bottom:4px;}
  .admin-table td:first-child::before,.admin-table td[colspan]::before{content:none;}
  .admin-table td[colspan]{display:block;text-align:center;}
  .admin-table td>div{text-align:right;}
  .admin-table td:first-child>div{text-align:left;}
}
</style>

</script>

    </div>
    <div class="cf-row">
      <div><label class="cf-l">혜택 문구</label><input id="cf-reward" class="cf-in" placeholder="15만원 상당"></div>
      <div><label class="cf-l">적립 포인트 (리뷰완료 시)</label><input id="cf-points" class="cf-in" type="number" placeholder="10"></div>
    </div>
    <div class="cf-row">
      <div><label class="cf-l">모집 인원</label><input id="cf-cap" class="cf-in" type="number" placeholder="20"></div>
      <div><label class="cf-l">마감일</label><input id="cf-deadline" class="cf-in" type="date"></div>
    </div>
    <label class="cf-l">소개</label><textarea id="cf-desc" class="cf-in" rows="3" placeholder="캠페인 소개 문구"></textarea>
    <label class="cf-check"><input type="checkbox" id="cf-hot"> 🔥 HOT 뱃지 표시</label>
    <div style="margin-top:18px;padding-top:14px;border-top:1px solid var(--border);"><div style="font-size:13px;font-weight:800;color:var(--brand-primary);margin-bottom:4px;">리뷰 미션 규칙</div><div style="font-size:12px;color:var(--text-muted);margin-bottom:8px;">손님이 리뷰 제출 시 자동으로 검사할 조건이에요.</div></div>
    <label class="cf-l">리뷰 기간 방식</label>
    <div class="cf-seg" id="cf-period-seg">
      <button type="button" class="cf-seg-btn on" data-p="rel" onclick="cfSetPeriod('rel')">당첨 후 기간(통상 2주)</button>
      <button type="button" class="cf-seg-btn" data-p="fixed" onclick="cfSetPeriod('fixed')">고정 마감날짜</button>
    </div>
    <div id="cf-rel-box" class="cf-row" style="margin-top:8px;">
      <div><label class="cf-l">방문 기한(당첨 후 며칠)</label><input id="cf-visit" class="cf-in" type="number" placeholder="14"></div>
      <div><label class="cf-l">리뷰 기한(방문 후 며칠)</label><input id="cf-reviewdays" class="cf-in" type="number" placeholder="14"></div>
    </div>
    <div id="cf-fixed-box" class="cf-row" style="margin-top:8px;display:none;">
      <div><label class="cf-l">방문 마감일</label><input id="cf-visitdl" class="cf-in" type="date"></div>
      <div><label class="cf-l">리뷰 제출 마감일</label><input id="cf-reviewdl" class="cf-in" type="date"></div>
    </div>
    <label class="cf-l">키워드 세트 (콤마로 구분, 손님이 이 중 1개 골라 반복)</label>
    <input id="cf-keywords" class="cf-in" placeholder="예: 역삼동맛집, 강남오마카세, 역삼오마카세, 강남맛집추천">
    <div class="cf-row">
      <div><label class="cf-l">선택 키워드 최소 반복</label><input id="cf-kwmin" class="cf-in" type="number" placeholder="5"></div>
      <div><label class="cf-l">최소 글자수</label><input id="cf-minchars" class="cf-in" type="number" placeholder="1500"></div>
    </div>
    <div class="cf-row">
      <div><label class="cf-l">최소 이미지 수</label><input id="cf-minimg" class="cf-in" type="number" placeholder="15"></div>
      <div><label class="cf-l">최소 영상 수</label><input id="cf-minvid" class="cf-in" type="number" placeholder="2"></div>
    </div>
    <label class="cf-check"><input type="checkbox" id="cf-banner" checked> 상단 체험단 배너 필수</label>
    <div id="cfMsg" class="cf-msg"></div>
    <div class="cf-actions">
      <button class="cf-del" id="cfDelBtn" onclick="deleteCampFromForm()" style="display:none;">삭제</button>
      <div style="flex:1;"></div>
      <button class="cf-btn ghost" onclick="closeCampForm()">취소</button>
      <button class="cf-btn pri" id="cfSaveBtn" onclick="saveCampForm()">저장</button>
    </div>
  </div>
</div></div>
<script>
function _cesc(x){return (x==null?'':String(x)).replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});}
function _cmd(d){ if(!d) return '-'; var p=String(d).slice(0,10).split('-'); return p[1]+'.'+p[2]; }
var _editId=null;
var _cfPeriod='rel';
function cfSetPeriod(pmode){
  _cfPeriod=pmode;
  document.querySelectorAll('#cf-period-seg .cf-seg-btn').forEach(function(b){ b.classList.toggle('on', b.getAttribute('data-p')===pmode); });
  var rel=document.getElementById('cf-rel-box'), fx=document.getElementById('cf-fixed-box');
  if(rel) rel.style.display=(pmode==='rel')?'grid':'none';
  if(fx) fx.style.display=(pmode==='fixed')?'grid':'none';
}
window.__camps={};
function _v(id){ return (document.getElementById(id).value||'').trim(); }
function cfMsg(t,ok){ var m=document.getElementById('cfMsg'); m.style.display='block'; m.textContent=t; m.style.background=ok?'rgba(46,213,115,.12)':'rgba(255,71,87,.12)'; m.style.color=ok?'#2ED573':'var(--brand-primary)'; }
function openCampForm(id){
  _editId=id||null;
  document.getElementById('cfTitle').textContent=_editId?'캠페인 수정':'새 캠페인 등록';
  document.getElementById('cfDelBtn').style.display=_editId?'inline-block':'none';
  document.getElementById('cfMsg').style.display='none';
  var c=_editId?window.__camps[_editId]:{};
  document.getElementById('cf-title').value=c.title||'';
  document.getElementById('cf-store').value=c.store_name||'';
  document.getElementById('cf-region').value=c.region||'';
  document.getElementById('cf-cat').value=c.category||'맛집';
  document.getElementById('cf-channel').value=c.channel||'블로그';
  document.getElementById('cf-img').value=c.image_key||'';
  document.getElementById('cf-status').value=c.status||'active';
  document.getElementById('cf-reward').value=c.reward_text||'';
  document.getElementById('cf-points').value=(c.reward_points!=null?c.reward_points:'');
  document.getElementById('cf-cap').value=(c.capacity!=null?c.capacity:'');
  document.getElementById('cf-deadline').value=c.deadline?String(c.deadline).slice(0,10):'';
  document.getElementById('cf-desc').value=c.description||'';
  document.getElementById('cf-hot').checked=!!c.is_hot;
  document.getElementById('cf-visit').value=(c.visit_days!=null?c.visit_days:14);
  document.getElementById('cf-reviewdays').value=(c.review_days!=null?c.review_days:14);
  document.getElementById('cf-visitdl').value=c.visit_deadline?String(c.visit_deadline).slice(0,10):'';
  document.getElementById('cf-reviewdl').value=c.review_deadline?String(c.review_deadline).slice(0,10):'';
  cfSetPeriod((c.visit_deadline||c.review_deadline)?'fixed':'rel');
  document.getElementById('cf-keywords').value=c.keywords||'';
  document.getElementById('cf-kwmin').value=(c.keyword_min!=null?c.keyword_min:5);
  document.getElementById('cf-minchars').value=(c.min_chars!=null?c.min_chars:1000);
  document.getElementById('cf-minimg').value=(c.min_images!=null?c.min_images:15);
  document.getElementById('cf-minvid').value=(c.min_videos!=null?c.min_videos:2);
  document.getElementById('cf-banner').checked=(c.require_banner!==false);
  document.getElementById('cfOverlay').style.display='flex';
}
function closeCampForm(){ document.getElementById('cfOverlay').style.display='none'; }
async function saveCampForm(){
  var title=_v('cf-title'); if(!title){ cfMsg('캠페인명을 입력해주세요.'); return; }
  var fields={ title:title, store_name:_v('cf-store')||null, region:_v('cf-region')||null,
    category:_v('cf-cat'), channel:_v('cf-channel'), image_key:_v('cf-img')||null,
    status:_v('cf-status'), reward_text:_v('cf-reward')||null,
    reward_points:parseInt(_v('cf-points'),10)||0, capacity:parseInt(_v('cf-cap'),10)||0,
    deadline:_v('cf-deadline')||null, description:_v('cf-desc')||null,
    is_hot:document.getElementById('cf-hot').checked,
    visit_days:parseInt(_v('cf-visit'),10)||14, review_days:parseInt(_v('cf-reviewdays'),10)||14,
    visit_deadline:(_cfPeriod==='fixed'?(_v('cf-visitdl')||null):null), review_deadline:(_cfPeriod==='fixed'?(_v('cf-reviewdl')||null):null),
    keywords:_v('cf-keywords')||null, keyword_min:parseInt(_v('cf-kwmin'),10)||5,
    min_chars:parseInt(_v('cf-minchars'),10)||1000, min_images:parseInt(_v('cf-minimg'),10)||15,
    min_videos:parseInt(_v('cf-minvid'),10)||2, require_banner:document.getElementById('cf-banner').checked };
  var btn=document.getElementById('cfSaveBtn'); btn.disabled=true; var o=btn.textContent; btn.textContent='저장 중…';
  var r=_editId? await OnAuth.updateCampaign(_editId, fields) : await OnAuth.createCampaign(fields);
  btn.disabled=false; btn.textContent=o;
  if(r&&r.error){ cfMsg('저장 실패: '+r.error.message); return; }
  closeCampForm(); loadCamps();
}
async function deleteCampFromForm(){
  if(!_editId) return;
  if(!confirm('이 캠페인을 삭제할까요?\n신청 내역도 함께 삭제됩니다. 되돌릴 수 없어요.')) return;
  var r=await OnAuth.deleteCampaign(_editId);
  if(r&&r.error){ cfMsg('삭제 실패: '+r.error.message); return; }
  closeCampForm(); loadCamps();
}
function _statusBadge(st){ return st==='active'?'<span class="s-badge s-active">진행중</span>':'<span class="s-badge s-done">마감</span>'; }
async function loadCamps(){
  var body=document.getElementById('campBody');
  var r=await OnAuth.adminListCampaigns();
  if(r.error){ body.innerHTML='<tr><td colspan="9" style="text-align:center;padding:30px 0;color:var(--text-muted);">불러오기 실패: '+_cesc(r.error.message)+'</td></tr>'; return; }
  var rows=r.data||[]; window.__camps={};
  document.getElementById('campCount').textContent='('+rows.length+'개)';
  if(!rows.length){ body.innerHTML='<tr><td colspan="9" style="text-align:center;padding:34px 0;color:var(--text-muted);">아직 등록된 캠페인이 없어요. 우측 상단 <b>+ 새 캠페인 등록</b>으로 추가하세요.</td></tr>'; return; }
  body.innerHTML=rows.map(function(c){ window.__camps[c.id]=c;
    var hot=c.is_hot?' <span class="s-badge" style="background:rgba(255,71,87,.15);color:#FF5A5F;">HOT</span>':'';
    return '<tr>'
      +'<td>'+_cesc(c.title)+hot+'</td>'
      +'<td data-label="광고주" style="color:var(--text-muted);">'+_cesc(c.store_name||'-')+'</td>'
      +'<td data-label="지역" style="color:var(--text-muted);">'+_cesc(c.region||'-')+'</td>'
      +'<td data-label="카테고리" style="color:var(--text-muted);">'+_cesc(c.category||'-')+'</td>'
      +'<td data-label="모집인원" style="color:var(--text-muted);">'+(c.capacity||0)+'명</td>'
      +'<td data-label="신청" style="color:var(--text-muted);">'+(c.applied_count||0)+'명</td>'
      +'<td data-label="마감일" style="color:var(--text-muted);">'+_cmd(c.deadline)+'</td>'
      +'<td data-label="상태">'+_statusBadge(c.status)+'</td>'
      +'<td data-label="관리" style="white-space:nowrap;"><a href="#" class="camp-edit" data-id="'+c.id+'" style="color:var(--brand-primary);font-size:12px;font-weight:700;">수정</a> <a href="#" class="camp-toggle" data-id="'+c.id+'" style="color:var(--text-muted);font-size:12px;font-weight:700;margin-left:8px;">'+(c.status==='active'?'마감':'재개')+'</a></td>'
      +'</tr>';
  }).join('');
  body.querySelectorAll('.camp-edit').forEach(function(a){ a.addEventListener('click',function(e){ e.preventDefault(); openCampForm(this.getAttribute('data-id')); }); });
  body.querySelectorAll('.camp-toggle').forEach(function(a){ a.addEventListener('click',async function(e){ e.preventDefault(); var id=this.getAttribute('data-id'); var c=window.__camps[id]; var ns=c.status==='active'?'closed':'active'; if(!confirm(ns==='closed'?'이 캠페인을 마감할까요?':'이 캠페인을 다시 진행중으로 바꿀까요?')) return; var rr=await OnAuth.updateCampaign(id,{status:ns}); if(rr&&rr.error){ alert('실패: '+rr.error.message); return; } loadCamps(); }); });
  // 검색
  var si=document.querySelector('.search-input');
  if(si){ si.oninput=function(){ var q=this.value.toLowerCase(); body.querySelectorAll('tr').forEach(function(tr){ tr.style.display=tr.textContent.toLowerCase().indexOf(q)>=0?'':'none'; }); }; }
}
document.addEventListener('click',function(e){ if(e.target&&e.target.id==='cfOverlay') closeCampForm(); });
window.__adminReady = loadCamps;
</script>
<script>
document.addEventListener('click',function(e){
  var a=e.target.closest?e.target.closest('a.sidebar-link'):null;
  if(a && a.getAttribute('href')==='#'){ e.preventDefault(); alert('준비 중인 기능이에요. 곧 추가됩니다!'); }
});
</script>
<script src="../../assets/js/pwa.js" defer></script>
</body></html>
